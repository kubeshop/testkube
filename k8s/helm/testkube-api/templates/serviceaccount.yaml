{{- /* Test job service accounts get testServiceAccount.annotations, or serviceAccount.annotations when that is empty, which is what they always got before. */}}
{{- $testServiceAccountAnnotations := .Values.testServiceAccount.annotations | default .Values.serviceAccount.annotations }}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "testkube-api.serviceAccountName" . }}
  labels:
    {{- include "global.labels.standard" . | nindent 4 }}
    {{- if .Values.global.labels }}
    {{- include "global.tplvalues.render" ( dict "value" .Values.global.labels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if or .Values.serviceAccount.annotations .Values.global.annotations }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.global.annotations }}
    {{- include "global.tplvalues.render" ( dict "value" .Values.global.annotations "context" $ ) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

{{- if .Values.testServiceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "testkube-api.testServiceAccountName" . }}
  labels:
    {{- include "global.labels.standard" . | nindent 4 }}
    {{- if .Values.global.labels }}
    {{- include "global.tplvalues.render" ( dict "value" .Values.global.labels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if or $testServiceAccountAnnotations .Values.global.annotations }}
  annotations:
    {{- with $testServiceAccountAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.global.annotations }}
    {{- include "global.tplvalues.render" ( dict "value" .Values.global.annotations "context" $ ) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

{{- if .Values.executionNamespaces }}
{{- range .Values.executionNamespaces }}
{{- $rangeItem := . -}}
{{- with $ }}

{{- if $rangeItem.generateTestJobRBAC }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $rangeItem.jobServiceAccountName }}
  namespace: {{ $rangeItem.namespace }}
  labels:
    {{- include "global.labels.standard" . | nindent 4 }}
    {{- if .Values.global.labels }}
    {{- include "global.tplvalues.render" ( dict "value" .Values.global.labels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if or $testServiceAccountAnnotations .Values.global.annotations }}
  annotations:
    {{- with $testServiceAccountAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.global.annotations }}
    {{- include "global.tplvalues.render" ( dict "value" .Values.global.annotations "context" $ ) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

{{- end }}
{{- end }}
{{- end }}