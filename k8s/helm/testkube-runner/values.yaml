global:
  imageRegistry: ""
  imagePullSecrets: []
  labels: {}
  annotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podDisruptionBudget:
    enabled: false

## Global TestWorkflowTemplate that will be automatically included for all executions
globalTemplate:
  ## Is global template enabled
  enabled: false
  ## Specification for the global template
  spec: {}
  # spec:
  #   pod:
  #     imagePullSecrets:
  #     - name: regcred

runner:
  ## Enable or disable the runner
  enabled: true
  ## Runner name used during self-registration. Defaults to chart fullname when empty.
  name: ""
  ## Agent ID
  id: ""
  ## Organization ID
  orgId: ""
  ## Environment ID
  envId: ""
  ## Secret Key
  secret: ""
  ## Retrieve credential information from an existing secret
  secretRef:
    ## Name of the secret. If set, this will be used instead of the above values
    name: ""
    ## Key for the Agent ID
    idKey: "id"
    ## Key for the Organization ID
    orgIdKey: "orgId"
    ## Key for the Environment ID
    envIdKey: "envId"
    ## Key for the Secret Key
    secretKey: "secret"
  ## Self-registration using API token
  register:
    ## Control Plane API token
    token: ""
    ## Control Plane API token provided via k8s secret
    tokenSecret:
      name: ""
      key: token
    ## Whether to register as a Floating runner
    floating: false
    ## Whether to register with mode Global
    global: false
    ## Whether to register with mode Group, global must be disabled
    # groupName: ""
    ## Label key prefix to filter the ones that will be used for the runner, example: runner.testkube.io/env: testing --> env=testing
    labelPrefix: runner.testkube.io/
    ## Whether to register with labels
    # labels:
    #   env: testing

## Listener configuration for triggers
listener:
  ## Enable listener functionality
  enabled: false
  ## Watch all namespaces instead of a specific list
  watchAllNamespaces: false
  ## Custom event labels which to put on events emitted from this listener
  eventLabels: {}
  ## Additional namespaces to watch
  additionalNamespaces: []
  ## Extra resources the listener watchers role should cover. Required when
  ## TestTriggers or WorkflowTriggers use `resourceRef` to target a CRD that
  ## isn't in the default watchers role (e.g. cert-manager, Kafka, Strimzi).
  ## Verbs default to [get, list, watch].
  ## Example:
  ##   extraWatchedResources:
  ##     - apiGroups: ["cert-manager.io"]
  ##       resources: ["certificates"]
  extraWatchedResources: []

## Webhooks capability configuration
webhooks:
  ## Enable webhooks functionality
  enabled: false

## GitOps capability configuration
gitops:
  ## Enable Kubernetes to Control Plane sync
  enabled: false
  ## Install the shared Testkube CRDs required by GitOps watchers
  installCRD: true

execution:
  default:
    ## Default namespace to run executions
    namespace: ""
    serviceAccount:
      ## Auto-create service account, roles, and role bindings to allow running the execution
      autoCreate: true
      ## Use an external service account for executions
      name: ""
      ## Extra annotations for the auto-created execution service account
      annotations: {}
  ## Allow run in other namespaces
  additionalNamespaces:
  # another:
  #   serviceAccount:
  #     autoCreate: true
  #     name: ""
  #     annotations: {}

cloud:
  ## URL of the Cloud Saas Control Plane
  url: "agent.testkube.io:443"
  tls:
    ## Toggle should the connection to Agent API in Cloud/Enterprise use secure GRPC (GRPCS) (if false, it will use insecure GRPC)
    enabled: true
    ## Toggle should the client skip verifying the Agent API server cert in Cloud/Enterprise
    skipVerify: false
    customCa:
      secretRef:
        ## If specified, injects a custom CA into the list of trusted CAs. Specify a secret with the PEM encoded CA under the key specified by customCaSecretKey.
        name: ""
        ## Specify the key for the PEM encoded CA in the secret specified by customCaSecretRef.
        key: "ca.crt"
      # -- Specifies the path to the directory (skip the trailing slash) where CA certificates should be mounted. The mounted file should container a PEM encoded CA certificate.
      dirPath: ""
    certificate:
      ## When provided, it will use the provided certificates when authenticating with the Agent (gRPC) API (secret should contain cert.crt, key.crt and ca.crt)
      secretRef: ""
      ## Default path for a certificate file
      certFile: /tmp/agent-cert/cert.crt
      ## Default path for a certificate key file
      keyFile: /tmp/agent-cert/cert.key
      ## Default path for a ca file
      caFile: /tmp/agent-cert/ca.crt

nameOverride: ""
fullnameOverride: ""

deployment:
  labels: {}
  annotations: {}

images:
  agent:
    registry: docker.io
    repository: kubeshop/testkube-api-server
    pullPolicy: IfNotPresent
    ## Overrides the image tag whose default is the chart appVersion.
    # tag: "2.1.147"
    digest: ""
    tagSuffix: ""
    pullSecrets: []

  toolkit:
    registry: docker.io
    repository: kubeshop/testkube-tw-toolkit
    ## Overrides the image tag whose default is the api-server version.
    # tag: "2.1.147"
    digest: ""
    tagSuffix: ""

  init:
    registry: docker.io
    repository: kubeshop/testkube-tw-init
    ## Overrides the image tag whose default is the api-server version.
    # tag: "2.1.147"
    digest: ""
    tagSuffix: ""

## Persistent cache for Docker
imageInspectionCache:
  ## Status of the persistent cache
  enabled: true
  ## ConfigMap name to persist cache
  name: "testkube-image-cache"
  ## TTL for image pull secrets cache (set to 0 to disable)
  ttl: 30m

pod:
  serviceAccount:
    ## Automatically create service account, roles, and role bindings
    autoCreate: true
    ## Use an external service account
    name: ""
    ## Extra annotations for the auto-created runner service account
    annotations: {}
  ## Extra labels for Testkube Agent pod
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  labels: {}
  ## Extra labels for Testkube Agent pod
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}
  ## Node labels for Testkube Agent pod assignment
  nodeSelector: {}
  ## Tolerations for Testkube Agent assignment
  tolerations: []
  ## Affinity for Testkube Agent pod assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  ## Note: podAffinityPreset, podAntiAffinityPreset, and nodeAffinityPreset will be ignored when it's set
  affinity: {}
  ## Specify priorityClassName for Testkube Agent pod
  priorityClassName: ""
  ## Specify hostNetwork for Testkube Agent pod
  hostNetwork: ""
  ## Specify dnsPolicy for Testkube Agent pod
  dnsPolicy: ""
  ## Additional volumes to be added
  ## ref: https://kubernetes.io/docs/concepts/storage/volumes/
  additionalVolumes: []
  ## Additional volume mounts to be added
  ## ref: https://kubernetes.io/docs/concepts/storage/volumes/
  additionalVolumeMounts: []
  ## Pod Security Context for Testkube Agent
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  securityContext: {}
  ## Configure Container Security Context for Testkube Agent
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  containerSecurityContext: {}
  ## Testkube Agent Liveness probe
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
  readinessProbe:
    enabled: true
  ## Testkube Agent resource requests and limits
  resources: {}
  # We usually recommend not specifying default resources and to leave this as a conscious
  # choice for the user. This also increases the chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  ## Extra Environment Variables which will be injected into the Testkube Agent container
  extraEnvVars: []
  # - name: FOO
  #   value: BAR

## Service parameters
service:
  ## Service type
  type: ClusterIP
  ## External Service port. NOTE: the runner container always listens on 8088
  ## internally (APISERVER_PORT is hardcoded in the deployment template) and
  ## the ServiceMonitor scrapes that port directly, so changing this only
  ## affects the Service's external port — not metrics scraping.
  port: 8088
  ## Service Annotations
  annotations: {}
  ## Service labels
  labels: {}
  ## NOTE: the runner does not expose a gRPC listener (unlike testkube-api),
  ## so no `grpcPort` is published here.

## Prometheus monitoring
prometheus:
  ## Toggle whether to install ServiceMonitor
  enabled: false
  ## Additional monitoring labels applied to the ServiceMonitor
  monitoringLabels: {}
  ## Scrape interval
  interval: 15s

## Enable a [pod disruption budget](https://kubernetes.io/docs/tasks/run-application/configure-pdb/) to help dealing with [disruptions](https://kubernetes.io/docs/concepts/workloads/pods/disruptions/).
podDisruptionBudget:
  enabled: false
  # -- (int/percentage) Number or percentage of pods that must remain available.
  minAvailable: ""
  # -- (int/percentage) Number or percentage of pods that can be unavailable.
  maxUnavailable: ""

## Enable analytics for Testkube
analyticsEnabled: true

## allow using low-security fields for test workflow pod and container configurations
allowLowSecurityFields: false

## default sizeLimit for internally generated emptyDir volumes (e.g. "256Mi", "1Gi")
## set this if your cluster enforces sizeLimit on emptyDir volumes via admission policies
emptyDirSizeLimit: ""

## Default image pull policy for the internally injected test workflow runner images
## (init/toolkit), e.g. "Always", "IfNotPresent" or "Never". Leave empty to use the
## Kubernetes default.
## NOTE: "Never" requires these runner images to be pre-pulled on every node that runs
## workflows; otherwise pods fail with ErrImageNeverPull.
defaultImagePullPolicy: ""

## default resource requests and limits for test workflow runner containers
defaultRunnerResources:
  requests:
    cpu: ""
    memory: ""
  limits:
    cpu: ""
    memory: ""

## Shared volume for step dependency caches.
##
## A step's `cache:` entries are normally stored whole in the object store, so every
## restore downloads the archive over HTTP. Point this at an existing ReadWriteMany
## claim and the entries live on it instead: a restore becomes a local copy, with no
## transfer and nothing to unpack. The object store still holds a small pointer to each
## entry, so it still decides who may store what.
##
## Everything on the volume is readable by every execution in the cluster. The object
## store still decides who may *write* an entry, so a pull request cannot poison the
## cache a trusted run restores - but every workflow can read what every other workflow
## cached. Only enable this where that is acceptable.
##
## The claim must already exist in this chart's release namespace and in every
## namespace executions run in; the chart does not create it. Claims in different
## namespaces must expose the same backing storage.
##
## The agent creates each execution's directory on the volume itself, so that a step
## running as a non-root user can write to it. It must therefore be able to write to
## the share: an NFS export that squashes the agent's user leaves the cache unusable,
## and every save falls back to the object store.
##
## A WORKFLOW'S OWN COMMAND HOLDS A WRITABLE MOUNT ON THIS VOLUME. The stage that
## saves an entry runs inside the step's container rather than beside it, so whatever
## the workflow runs can write into its own directory on the shared claim directly,
## without going through the cache at all. Two consequences, neither of which the
## agent can undo:
##
##   - It can write past the cache's size and entry limits, because those bound what
##     the cache copies and not what the step writes. One workflow can fill the claim
##     for every execution in the cluster.
##   - It can leave directories only its own user may enter. The agent sweeps as a
##     different user, is not root, and cannot chown or chmod what it does not own -
##     and fsGroup is not applied to NFS at all - so that space is never reclaimed.
##     This one is permanent, and survives the execution that caused it.
##
## Enable this only where every workflow that can run in the environment is trusted
## with the claim. Where they are not, leave it disabled and let caches go to the
## object store, which grants each upload separately and holds no shared filesystem.
stepCacheVolume:
  # -- Store step dependency caches on a shared volume instead of in the object store
  enabled: false
  # -- Name of an existing ReadWriteMany PersistentVolumeClaim
  claimName: ""
  # -- Where the volume is mounted inside this deployment, for the expiry sweep
  mountPath: "/var/testkube/step-cache"
  # -- How long an execution's cached trees survive on the volume.
  ## Must be at least storage.cacheExpiration: an entry outliving its pointer only
  ## wastes space, where a pointer outliving its entry is a restore that reports a miss
  ## it cannot explain.
  retentionDays: 7
  # -- How often to sweep the volume for expired entries
  sweepInterval: "1h"
  # -- How many days a cache object survives in the store the Control Plane owns.
  ## A runner has no access to that bucket and cannot read its lifecycle, so it has to
  ## be told. The sweep is held to at least this long: deleting an entry while the
  ## object pointing at it is still served leaves that key restoring nothing, and the
  ## object is immutable, so no later run can repair it until it expires.
  ##
  ## Set it to the shortest rule that applies to cache objects there - the cache rule
  ## or a shorter bucket-wide one, whichever comes first. 0 means nothing expires them,
  ## which no retention can outlast; the runner then warns and sweeps on retentionDays
  ## alone.
  objectExpirationDays: 1
