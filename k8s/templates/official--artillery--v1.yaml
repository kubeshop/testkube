kind: TestWorkflowTemplate
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: official--artillery--v1
  labels:
    testkube.io/name: Artillery
    testkube.io/wizard: enabled
  annotations:
    testkube.io/categories: Load & Performance
    testkube.io/description: Run Artillery tests
    testkube.io/icon: artillery
    testkube.io/image: artilleryio/artillery
    testkube.io/example-path: script.yaml
    testkube.io/example: |
      config:
        target: "https://testkube.kubeshop.io/"
        phases:
        - duration: 1
          arrivalRate: 1
      scenarios:
      - name: homepage
        flow:
          - get:
              url: "/"
          - think: 0.1
spec:
  config:
    version:
      description: Artillery version to use
      type: string
      default: 2.0.23
    artillery_binary:
      description: Optional Artillery binary override; empty detects artillery in PATH, then checks /home/node/artillery/bin/run and /home/node/artillery/bin/artillery
      type: string
      default: ""
    run:
      description: Run command
      type: string
      default: "mkdir -p /data/artifacts && artillery run script.yaml -o /data/artifacts/artillery-report.json"
  steps:
  - name: Run Artillery tests
    run:
      image: "artilleryio/artillery:{{ config.version }}"
      shell: |
        artillery_binary="{{ config.artillery_binary }}"
        if [ -z "$artillery_binary" ]; then
          artillery_binary="$(command -v artillery || true)"
          if [ -z "$artillery_binary" ]; then
            for artillery_candidate in /home/node/artillery/bin/run /home/node/artillery/bin/artillery; do
              if [ -x "$artillery_candidate" ] && [ ! -d "$artillery_candidate" ]; then
                artillery_binary="$artillery_candidate"
                break
              fi
            done
          fi
        fi
        if ! command -v "$artillery_binary" >/dev/null 2>&1; then
          echo "Artillery binary not found: $artillery_binary. Set artillery_binary to an executable path or command available in PATH." >&2
          exit 1
        fi
        artillery() { command "$artillery_binary" "$@"; }
        {{ config.run }}
    artifacts:
      paths:
      - /data/artifacts/*
