apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: curl-workflow-smoke
  labels:
    core-tests: workflows
    tool: curl
    category: api-testing
    area: tools
  annotations:
    testkube.io/description: "Checks with curl 8.7.1 that the test page answers with a success status."
    testkube.io/icon: curl
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  job:
    activeDeadlineSeconds: 300
  steps:
    - name: Run tests
      shell: curl -f -LI https://testkube-test-page-lipsum.pages.dev/
      container:
        image: curlimages/curl:8.7.1
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: curl-workflow-smoke-private-registry
  labels:
    core-tests: workflows
    tool: curl
    category: api-testing
    area: engine
  annotations:
    testkube.io/description: "Runs the curl check from an image in a private registry, to prove that image pull secrets work."
    testkube.io/areas: engine,tools
    testkube.io/cost: light
    testkube.io/sandbox: needs-secrets
spec:
  pod:
    imagePullSecrets:
      - name: example-private-registry-credentials
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  job:
    activeDeadlineSeconds: 300
  steps:
    - name: Run tests
      shell: curl -f -LI https://testkube-test-page-lipsum.pages.dev/ && sleep 10
      container:
        image: tkoniecznykubeshop/example-private-repo:curl-8.7.1
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: curl-workflow-smoke-matrix
  labels:
    core-tests: workflows
    tool: curl
    category: api-testing
    area: parallel
  annotations:
    testkube.io/description: "Runs the curl check in parallel for each URL of a matrix, to prove the matrix expansion of a step."
    testkube.io/areas: parallel,tools
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  job:
    activeDeadlineSeconds: 300
  steps:
    - name: Run tests
      parallel:
        matrix:
          url:
            [
              "https://testkube-test-page-lipsum.pages.dev/",
              "https://docs.testkube.io",
            ]
        shell: curl -f -LI '{{ matrix.url }}'
        container:
          image: curlimages/curl:8.7.1
          resources:
            requests:
              cpu: 32m
              memory: 32Mi
