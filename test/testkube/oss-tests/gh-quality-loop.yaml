kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: oss-lint-pr
  labels:
    category: static-analysis
    quality-loop: "true"
    core-tests: testkube-oss
    tool: conventional-commits
  annotations:
    testkube.io/git-integration-managed: "false"
description: Conventional Commits PR title (replaces lint_pr.yaml / amannn/action-semantic-pull-request).
  Wire on pull_request only (opened/synchronize/reopened/ready_for_review). GitHub
  Integration does not fire on title-only edits.
spec:
  config:
    PR_NUMBER:
      type: string
      default: ""
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube.git
      revision: '{{config.revision}}'
  container:
    image: alpine:3.21
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
  job:
    activeDeadlineSeconds: 120
  steps:
  - name: Lint PR title
    shell: |
      set -eu
      apk add --no-cache curl jq >/dev/null

      PR_NUMBER='{{config.PR_NUMBER}}'
      if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "0" ]; then
        echo "PR_NUMBER is empty — lint-pr is PR-only. Do not wire this workflow on push."
        exit 1
      fi

      TITLE=$(curl -fsSL \
        -H "Accept: application/vnd.github+json" \
        -H "User-Agent: testkube-lint-pr" \
        "https://api.github.com/repos/kubeshop/testkube/pulls/${{"{"}}PR_NUMBER}" \
        | jq -r '.title // empty')

      if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
        echo "Could not read title for PR #${{"{"}}PR_NUMBER}"
        exit 1
      fi

      echo "PR #${{"{"}}PR_NUMBER} title: ${{"{"}}TITLE}"

      TYPES='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
      if echo "$TITLE" | grep -Eq "^(${{"{"}}TYPES})(\([^)]+\))?(!)?: .+"; then
        echo "OK: conventional commit title"
        exit 0
      fi

      printf '%s\n' \
        "No release type found in pull request title \"${{"{"}}TITLE}\". Add a prefix to indicate what kind of release this pull request corresponds to. For reference, see https://www.conventionalcommits.org/" \
        "" \
        "Available types:" \
        " - feat: A new feature" \
        " - fix: A bug fix" \
        " - docs: Documentation only changes" \
        " - style: Changes that do not affect the meaning of the code (white-space, formatting, missing semi-colons, etc)" \
        " - refactor: A code change that neither fixes a bug nor adds a feature" \
        " - perf: A code change that improves performance" \
        " - test: Adding missing tests or correcting existing tests" \
        " - build: Changes that affect the build system or external dependencies (example scopes: gulp, broccoli, npm)" \
        " - ci: Changes to our CI configuration files and scripts (example scopes: Travis, Circle, BrowserStack, SauceLabs)" \
        " - chore: Other changes that don't modify src or test files" \
        " - revert: Reverts a previous commit"
      exit 1
