kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: docs-prettier
  labels:
    category: static-analysis
    quality-loop: "true"
    core-tests: docs
    tool: prettier
  annotations:
    testkube.io/git-integration-managed: "false"
description: Prettier check (replaces prettier.yml). Runs on all PRs and on push to
  main.
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube-docs.git
      revision: '{{config.revision}}'
  container:
    workingDir: /data/repo
    env:
    - name: npm_config_cache
      value: /root/.npm
    image: node:20-bookworm
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
  job:
    activeDeadlineSeconds: 600
  steps:
  - name: Check formatting
    cache:
      key: oss-quality-loop-npm-{{hash_files("/data/repo/package-lock.json")}}
      restoreKeys:
      - oss-quality-loop-npm-
      paths:
      - /root/.npm/_cacache
      scope: environment
    timeout: 10m
    run:
      env:
      - name: HUSKY
        value: "0"
      shell: |
        npm ci --prefer-offline
        npm run format:check
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: oss-lint-go
  labels:
    category: static-analysis
    quality-loop: "true"
    core-tests: testkube-oss
    tool: golangci-lint
  annotations:
    testkube.io/git-integration-managed: "false"
description: golangci-lint (replaces lint.yaml Go step). Runs on PRs to main (all
  files) and on feature-branch pushes (skip main/renovate/dependabot).
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube.git
      revision: '{{config.revision}}'
  container:
    workingDir: /data/repo
    env:
    - name: GOMODCACHE
      value: /root/go/pkg/mod
    image: golangci/golangci-lint:v2.13.1
    resources:
      limits:
        cpu: 4500m
        memory: 6Gi
      requests:
        cpu: 3500m
        memory: 4Gi
  job:
    activeDeadlineSeconds: 900
  steps:
  - name: Verify golangci-lint config
    shell: golangci-lint config verify
  - name: Lint Go
    cache:
      key: oss-quality-loop-gomod-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum")}}
      restoreKeys:
      - oss-quality-loop-gomod-
      paths:
      - /root/go/pkg/mod/cache/download
      scope: environment
    timeout: 10m
    steps:
    - name: Analyze Go packages
      cache:
        # Entries are immutable: refresh for source/config changes, while reusing
        # compiled dependencies from the previous successful lint execution.
        key: oss-lint-go-v1-golangci-2.13.1-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum", "/data/repo/.golangci.yml", "/data/repo/**/*.go")}}
        restoreKeys:
        - oss-lint-go-v1-golangci-2.13.1-
        paths:
        - /root/.cache/go-build
        - /root/.cache/golangci-lint
        scope: workflow
      run:
        env:
        - name: GOCACHE
          value: /root/.cache/go-build
        - name: GOLANGCI_LINT_CACHE
          value: /root/.cache/golangci-lint
        shell: golangci-lint run ./... --timeout=10m
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: oss-lint-proto
  labels:
    category: static-analysis
    quality-loop: "true"
    core-tests: testkube-oss
    tool: buf
  annotations:
    testkube.io/git-integration-managed: "false"
description: Buf lint / format / breaking (replaces lint.yaml protobuf step). Runs
  on PRs to main (all files) and on feature-branch pushes (skip main/renovate/dependabot).
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube.git
      revision: '{{config.revision}}'
  container:
    workingDir: /data/repo/proto
    image: bufbuild/buf:1.68.1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: Buf lint, format, breaking
    shell: |
      buf lint
      buf format --diff --exit-code --exclude-path logs.proto --exclude-path service.proto
      buf breaking --against "https://github.com/kubeshop/testkube.git#branch=main,subdir=proto" --exclude-imports
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: oss-integration-tests
  labels:
    category: api-testing
    quality-loop: "true"
    core-tests: testkube-oss
    artifacts: "true"
    junit: "true"
    coverage: "true"
    tool: go
  annotations:
    testkube.io/git-integration-managed: "false"
description: make integration-tests with Mongo/NATS/MinIO/Postgres (replaces test.yaml
  integration-tests, without Kind). Runs on push to main and PRs targeting main (opened/synchronize/reopened/ready_for_review).
  Listens to all paths except docs/**.
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube.git
      revision: '{{config.revision}}'
  container:
    workingDir: /data/repo
    env:
    - name: GOMODCACHE
      value: /root/go/pkg/mod
    image: golang:1.27.0-bookworm
    resources:
      limits:
        cpu: 4500m
        memory: 6Gi
      requests:
        cpu: 3500m
        memory: 4Gi
  job:
    activeDeadlineSeconds: 1800
  services:
    minio:
      logs: always
      timeout: 5m
      image: bitnamilegacy/minio:2025
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
      env:
      - name: MINIO_ROOT_USER
        value: minio99
      - name: MINIO_ROOT_PASSWORD
        value: minio123
      readinessProbe:
        tcpSocket:
          port: 9000
        periodSeconds: 1
    mongo:
      logs: always
      timeout: 5m
      image: mongo:8.0
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 2Gi
      readinessProbe:
        tcpSocket:
          port: 27017
        periodSeconds: 1
    nats:
      logs: always
      timeout: 5m
      image: nats:2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      readinessProbe:
        tcpSocket:
          port: 4222
        periodSeconds: 1
    postgres:
      logs: always
      timeout: 5m
      image: postgres:16.15
      args:
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      resources:
        requests:
          cpu: 1
          memory: 512Mi
        limits:
          cpu: 4
          memory: 2Gi
      env:
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        value: postgres
      - name: POSTGRES_DB
        value: postgres
      readinessProbe:
        tcpSocket:
          port: 5432
        periodSeconds: 1
  steps:
  - name: Integration tests
    cache:
      key: oss-quality-loop-gomod-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum")}}
      restoreKeys:
      - oss-quality-loop-gomod-
      paths:
      - /root/go/pkg/mod/cache/download
      scope: environment
    steps:
    - name: Run integration tests
      cache:
        # Keyed on the modules only: the build cache addresses its own contents, so it
        # stays correct across commits, where a key per commit would grow storage
        # without bound. go.mod carries the toolchain directive, and the image tag covers
        # an image newer than it: build outputs only serve the toolchain that made them.
        key: oss-integration-tests-v1-golang-1.27.0-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum")}}
        restoreKeys:
        - oss-integration-tests-v1-golang-1.27.0-
        paths:
        - /root/.cache/go-build
        scope: workflow
      timeout: 30m
      run:
        env:
        - name: GOPROXY
          value: https://proxy.golang.org,direct
        - name: INTEGRATION
          value: "true"
        - name: STORAGE_ACCESSKEYID
          value: minio99
        - name: STORAGE_SECRETACCESSKEY
          value: minio123
        - name: STORAGE_ENDPOINT
          value: 127.0.0.1:9000
        - name: MONGO_URL
          value: mongodb://127.0.0.1:27017
        - name: NATS_URI
          value: nats://127.0.0.1:4222
        - name: API_POSTGRES_URL
          value: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        - name: GOCACHE
          value: /root/.cache/go-build
        # GOCACHE also holds test results, which do not track the services these
        # tests talk to; always run the tests.
        - name: GOFLAGS
          value: -count=1
        shell: |
          apt-get update && apt-get install -y --no-install-recommends make socat git ca-certificates
          git config --global --add safe.directory /data/repo
          # GH Actions maps service ports to localhost; Testkube services are other pods.
          # Tests hardcode mongodb://localhost:27017, so we must forward rather than
          # pointing env vars at the service IPs.
          socat TCP-LISTEN:27017,fork,reuseaddr TCP:{{services.mongo.0.ip}}:27017 &
          mongo_fwd=$!
          socat TCP-LISTEN:4222,fork,reuseaddr TCP:{{services.nats.0.ip}}:4222 &
          nats_fwd=$!
          socat TCP-LISTEN:9000,fork,reuseaddr TCP:{{services.minio.0.ip}}:9000 &
          minio_fwd=$!
          socat TCP-LISTEN:5432,fork,reuseaddr TCP:{{services.postgres.0.ip}}:5432 &
          postgres_fwd=$!
          sleep 1
          # Toolkit k8s tests (test/integration/components/toolkit) spawn namespaces/pods.
          # GH uses Kind for that; skip them here — we are already on a cluster but
          # creating cluster-scoped namespaces needs extra RBAC we should not assume.
          make build-init build-toolkit
          # Testkube prepends `set -e`. Background socat children get SIGHUP when the
          # shell exits and ash/busybox then wait()s them; a 143 from socat would
          # overwrite gotestsum's 0. Capture the test status and ignore teardown.
          set +e
          INTEGRATION=true TESTKUBE_PROJECT_ROOT="$PWD" \
            go run gotest.tools/gotestsum@v1.12.3 --format short-verbose \
              --junitfile integration-tests.xml --jsonfile integration-tests.json -- \
              -coverprofile=integration-coverage.out -covermode=atomic \
              -run '_Integration$' ./internal/... ./pkg/... ./test/integration/components/init/...
          code=$?
          kill "$mongo_fwd" "$nats_fwd" "$minio_fwd" "$postgres_fwd" 2>/dev/null
          wait "$mongo_fwd" "$nats_fwd" "$minio_fwd" "$postgres_fwd" 2>/dev/null
          exit "$code"
      artifacts:
        paths:
        - integration-tests.xml
        - integration-coverage.out
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: oss-unit-tests
  labels:
    category: unit-component-testing
    quality-loop: "true"
    core-tests: testkube-oss
    artifacts: "true"
    junit: "true"
    coverage: "true"
    tool: go
  annotations:
    testkube.io/git-integration-managed: "false"
description: make unit-tests (replaces test.yaml unit-tests). Runs on push to main
  and PRs targeting main (opened/synchronize/reopened/ready_for_review). Listens to
  all paths except docs/**.
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube.git
      revision: '{{config.revision}}'
  container:
    workingDir: /data/repo
    env:
    - name: GOMODCACHE
      value: /root/go/pkg/mod
    image: golang:1.27.0-bookworm
    resources:
      limits:
        cpu: 8000m
        memory: 8Gi
      requests:
        cpu: 3500m
        memory: 6Gi
  job:
    activeDeadlineSeconds: 1200
  steps:
  - name: Unit tests
    cache:
      key: oss-quality-loop-gomod-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum")}}
      restoreKeys:
      - oss-quality-loop-gomod-
      paths:
      - /root/go/pkg/mod/cache/download
      scope: environment
    steps:
    - name: Run unit tests
      cache:
        # Keyed on the modules only: the build cache addresses its own contents, so it
        # stays correct across commits, where a key per commit would grow storage
        # without bound. go.mod carries the toolchain directive, and the image tag covers
        # an image newer than it: build outputs only serve the toolchain that made them.
        key: oss-unit-tests-v1-golang-1.27.0-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum")}}
        restoreKeys:
        - oss-unit-tests-v1-golang-1.27.0-
        paths:
        - /root/.cache/go-build
        scope: workflow
      run:
        env:
        - name: GOPROXY
          value: https://proxy.golang.org,direct
        - name: GOMAXPROCS
          value: "8"
        - name: GOCACHE
          value: /root/.cache/go-build
        # GOCACHE also holds test results; always run the tests.
        - name: GOFLAGS
          value: -count=1
        shell: |
          git config --global --add safe.directory /data/repo
          make unit-tests
      artifacts:
        paths:
        - unit-tests.xml
        - coverage.out
---
