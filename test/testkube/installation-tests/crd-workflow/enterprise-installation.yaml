apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: enterprise-installation-test
  labels:
    core-tests: installation
description: "Enterprise installation test - DinD+kind"
spec:
  execution:
    silent: true
  system:
    pureByDefault: true
  job:
    activeDeadlineSeconds: 900
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
        - test/postman/crd-workflow/smoke.yaml
        - test/testkube/installation-tests/enterprise-installation-expect-file.exp # expect file to finalize installation (user choices required): TKC-3026
  container:
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
  use:
    - name: setup-dind-kind-cluster-template
  steps:
  - name: Install Testkube CLI (and Expect)
    shell: |
      wget -qO- https://repo.testkube.io/key.pub | gpg --dearmor | tee /etc/apt/keyrings/testkube.gpg > /dev/null
      echo "deb [signed-by=/etc/apt/keyrings/testkube.gpg] https://repo.testkube.io/linux linux main" | tee /etc/apt/sources.list.d/testkube.list
      apt-get update && apt-get install -y testkube expect
      testkube disable telemetry
  - name: Install Testkube Enterprise Demo
    workingDir: /data/repo/test/testkube/installation-tests
    run:
      env:
      - name: LICENSE_KEY
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: ENTERPRISE_INSTALLATION_TEST_LICENSE_KEY
      - name: TESTKUBE_INIT_COMMAND
        value: "testkube init demo --no-confirm --license {{ env.LICENSE_KEY }} --helm-arg wait= --helm-arg timeout=10m --helm-set testkube-cloud-api.additionalEnv.FEATURE_SOURCE_OF_TRUTH_ON_ENV_CREATE=true --verbose"
      shell: |
        helm version
        helm list -n testkube-enterprise-installation-test
        echo $TESTKUBE_INIT_COMMAND
        chmod +x enterprise-installation-expect-file.exp
        expect enterprise-installation-expect-file.exp
    timeout: 720s
  - name: Wait for Testkube core components to be ready
    optional: true
    shell: |
      kubectl get deployments -ntestkube
      for dep in testkube-demo-runner testkube-enterprise-api testkube-enterprise-dex testkube-enterprise-minio testkube-enterprise-ui testkube-enterprise-worker-service; do
        echo "⏳ Waiting for $dep..."
        kubectl rollout status deployment/$dep -n testkube --timeout=300s || exit 1
      done

      echo "⏳ Waiting for testkube-enterprise-postgresql..."
      kubectl rollout status statefulset/testkube-enterprise-postgresql -n testkube --timeout=300s || exit 1

      echo "⏳ Waiting for testkube-enterprise-api endpoint..."
      for i in {1..30}; do
        kubectl get endpoints testkube-enterprise-api -n testkube -o jsonpath='{.subsets[*].addresses[*].ip}' | \
          grep -qE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' && break
        sleep 2
      done

      echo "✅ Testkube core components and API service are ready."
  - name: Create and run TestWorkflow via control plane
    workingDir: /data/repo/test/postman/crd-workflow
    timeout: 300s
    shell: |
      set -e
      apt-get update >/dev/null 2>&1 && apt-get install -y jq curl >/dev/null 2>&1

      kubectl port-forward -n testkube svc/testkube-enterprise-dex 5556:5556 >/tmp/pf-dex.log 2>&1 &
      kubectl port-forward -n testkube svc/testkube-enterprise-api 8088:8088 >/tmp/pf-api.log 2>&1 &
      trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
      DEX=http://localhost:5556
      API=http://localhost:8088
      for i in $(seq 1 30); do curl -so /dev/null "$API" && break; sleep 1; done

      ID_TOKEN=$(curl -sS "$DEX/token" \
        -d grant_type=password \
        -d username=admin@example.com \
        -d password=password \
        -d scope="openid email groups offline_access" \
        -d client_id=testkube-enterprise \
        -d client_secret=QWkVzs3nct6HZM5hxsPzwaZtq | jq -r .id_token)
      API_TOKEN=$(curl -sS -X POST "$API/organizations/tkcorg_demo/tokens" \
        -H "Authorization: Bearer $ID_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{"name":"install-test","scopes":[{"resource":"org","identifier":"tkcorg_demo","role":"admin"},{"resource":"env","identifier":"tkcenv_my-first-environment","role":"admin"}]}' \
        | jq -r '.token')

      testkube set context \
        --api-uri-override "$API" \
        --api-key "$API_TOKEN" \
        --org-id tkcorg_demo \
        --env-id tkcenv_my-first-environment

      awk 'BEGIN{n=0} /^---$/{n++; next} {print > ("tw_" n ".yaml")}' smoke.yaml
      for f in tw_*.yaml; do
        testkube create testworkflow --update -f "$f"
      done
      testkube run tw postman-workflow-smoke-junit --watch && echo "executed correctly"
  - name: Dump pod logs and describe
    condition: always
    shell: |
      set +e

      NS=testkube
      OUT=/data/artifacts/pod-logs
      mkdir -p "$OUT"

      echo "=== Pods in namespace $NS ==="
      kubectl -n "$NS" get pods -o wide > "$OUT/pods.txt" 2>&1 || true

      echo "=== Events in namespace $NS ==="
      kubectl -n "$NS" get events --sort-by=.lastTimestamp > "$OUT/events.txt" 2>&1 || true

      kubectl -n "$NS" get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' |
      while read -r POD; do
        echo "=== Dumping $POD ==="

        kubectl -n "$NS" describe pod "$POD" \
          > "$OUT/$POD.describe.txt" 2>&1 || true

        kubectl -n "$NS" logs "$POD" --all-containers --timestamps \
          > "$OUT/$POD.log" 2>&1 || true

        kubectl -n "$NS" logs "$POD" --all-containers --previous --timestamps \
          > "$OUT/$POD.previous.log" 2>&1 || true
      done
    artifacts:
      workingDir: /data/artifacts/
      paths:
      - '**/*'
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: enterprise-installation-multi-namespace
  labels:
    core-tests: installation
    environment-specific: dev
description: "Enterprise installation test - edge, multi-namespace. Can be run ONLY at .dev"
spec:
  system:
    pureByDefault: true
  concurrency:
    max: 1
  content:
    files:
    - path: /root/edge-cluster-sa-key.json
      contentFrom:
        secretKeyRef:
          name: testkube-agent-secrets
          key: ENTERPRISE_INSTALLATION_TEST_SA_KEY
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/testkube/installation-tests/enterprise-installation-expect-file.exp # expect file to finalize installation (user choices required): TKC-3026
  container:
    resources:
      requests:
        cpu: 512m
        memory: 256Mi
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest # contains gcloud, gke-gcloud-auth-plugin and kubectl
    workingDir: /data/repo/test/testkube/installation-tests
  job:
    activeDeadlineSeconds:  1200
  steps:
  - name: Install Helm
    shell: |
      # Install helm
      curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      helm version
  - name: Install Testkube CLI (and Expect)
    shell: |
      wget -qO- https://repo.testkube.io/key.pub | gpg --dearmor | tee /etc/apt/keyrings/testkube.gpg > /dev/null
      echo "deb [signed-by=/etc/apt/keyrings/testkube.gpg] https://repo.testkube.io/linux linux main" | tee /etc/apt/sources.list.d/testkube.list
      apt-get update && apt-get install -y testkube expect
      testkube disable telemetry
  - name: gcloud auth
    run:
      env:
      - name: SA_NAME
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: ENTERPRISE_INSTALLATION_TEST_SA_NAME
      shell: |
        gcloud auth activate-service-account {{ env.SA_NAME }} --key-file=/root/edge-cluster-sa-key.json
        gcloud container clusters get-credentials testkube-cloud-edge --region us-east1 --project testkube-328312
  - name: Cleanup before installation
    shell: kubectl delete namespace testkube-enterprise-installation-test --ignore-not-found
  - name: Test
    run:
      env:
      - name: LICENSE_KEY
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: ENTERPRISE_INSTALLATION_TEST_LICENSE_KEY
      - name: TESTKUBE_INIT_COMMAND
        value: "testkube init demo --namespace testkube-enterprise-installation-test --no-confirm --license {{ env.LICENSE_KEY }} --helm-set testkube-agent.testkube-api.multinamespace.enabled=true --helm-set testkube-agent.testkube-operator.enabled=false --helm-set dex.rbac.createClusterScoped=false --helm-set testkube-agent.testkube-operator.installCRD=false"
      shell: |
        helm version
        helm list -n testkube-enterprise-installation-test
        echo $TESTKUBE_INIT_COMMAND
        chmod +x enterprise-installation-expect-file.exp
        expect enterprise-installation-expect-file.exp
