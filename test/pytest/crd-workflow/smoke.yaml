apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: pytest-workflow-smoke-junit-random-failures
  labels:
    core-tests: expected-random-fail
    tool: pytest
    artifacts: "true"
    junit: "true"
    category: unit-component-testing
  annotations:
    testkube.io/description: "Runs pytest tests that fail at random next to passing ones, so the result changes between executions; it feeds flaky-test views."
    testkube.io/icon: pytest
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/pytest/pytest-project
  container:
    image: python:3.12.6-alpine3.20
    resources:
      requests:
        cpu: 256m
        memory: 256Mi
    workingDir: /data/repo/test/pytest/pytest-project
  job:
    activeDeadlineSeconds: 180
  steps:
  - name: Run random tests
    shell: |
      pip install -r requirements.txt
      mkdir /data/artifacts
      pytest tests/random tests/success --junit-xml=/data/artifacts/pytest-report.xml
    artifacts:
      paths:
      - "/data/artifacts/**"