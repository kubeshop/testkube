apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: junit5-workflow-smoke
  labels:
    core-tests: workflows
    tool: junit
    artifacts: "true"
    junit: "true"
    category: unit-component-testing
  annotations:
    testkube.io/description: "Checks that a passing JUnit 5 run with Maven passes and that its Surefire JUnit reports are kept."
    testkube.io/icon: junit
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/junit/junit5-project
  container:
    image: maven:3.9.9-eclipse-temurin-11-alpine
    resources:
      requests:
        cpu: 256m
        memory: 256Mi
    workingDir: /data/repo/test/junit/junit5-project
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: Run tests
    shell: mvn test -Dtest=TestSmoke1,TestSmoke2
    artifacts:
      paths:
      - 'target/surefire-reports/**/*'
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
