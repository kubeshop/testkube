kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: tw-suite-small-smoke
  labels:
    core-tests: workflows-suite
    type: suite
    area: tools
  annotations:
    testkube.io/description: "Groups one smoke workflow per main tool (Cypress, Playwright, Gradle, JMeter, k6, Postman, pytest), as a fast check that Testkube still runs them."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: k6-workflow-smoke
      - name: postman-workflow-smoke-template
      - name: cypress-workflow-smoke
      - name: jmeter-workflow-smoke-shell
      - name: pytest-workflow-smoke-junit-success-only
      - name: gradle-workflow-smoke-jdk11-from-template
      - name: distributed-playwright-workflow-smoke-junit