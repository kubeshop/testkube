kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: tw-suite-small-smoke-multiarch
  labels:
    core-tests: workflows-suite
    type: suite
    area: tools
  annotations:
    testkube.io/description: "Groups 5 smoke workflows with amd64 and arm64 images, to check that Testkube runs workflows on both architectures."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
description: "Small smoke test suite with only workflows using multiarch images (available for both amd64 and arm64)"
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: k6-workflow-smoke
      - name: curl-workflow-smoke-matrix
      - name: postman-workflow-smoke-template
      - name: pytest-workflow-smoke-junit-success-only
      - name: distributed-jmeter-workflow-smoke-shell