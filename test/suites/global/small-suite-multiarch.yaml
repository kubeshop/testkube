kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: tw-suite-small-smoke-multiarch
  labels:
    core-tests: workflows-suite
    type: suite
  annotations:
    testkube.io/description: "Suite of 5 smoke workflows whose images exist for both amd64 and arm64: curl matrix, distributed JMeter, k6, Postman template and pytest JUnit."
description: "Small smoke test suite with only workflows using multiarch images (available for both amd64 and arm64)"
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: k6-workflow-smoke
      - name: curl-workflow-smoke-matrix
      - name: postman-workflow-smoke-template
      - name: pytest-workflow-smoke-junit-success-only
      - name: distributed-jmeter-workflow-smoke-shell