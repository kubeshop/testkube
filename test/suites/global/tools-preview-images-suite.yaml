apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: tools-preview-images-suite
  labels:
    core-tests: tools-preview-images-suite
    type: suite
    area: tools
  annotations:
    testkube.io/description: "Groups the smoke workflows that use the latest and master tool images, to catch a break in a new release of Artillery, JMeter, k6, Locust or Postman."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: artillery-workflow-smoke-latest-image
      - name: artillery-workflow-smoke-template-latest
      - name: k6-workflow-smoke-latest-image
      - name: k6-workflow-smoke-master-image
      - name: locust-workflow-smoke-latest-image
      - name: locust-workflow-smoke-master-image
      - name: postman-workflow-smoke-latest-image
      - name: jmeter-workflow-smoke-latest-image
