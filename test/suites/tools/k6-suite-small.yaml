apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: k6-workflow-suite-small
  labels:
    core-tests: workflows-suite
    type: suite
    tool: k6
    area: tools
  annotations:
    testkube.io/description: "Groups 4 k6 workflows as a fast check of the k6 integration: smoke, template, inline content and distributed mode."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: k6-workflow-smoke
      - name: k6-workflow-smoke-template
      - name: k6-workflow-smoke-content-file
      - name: distributed-k6-workflow-smoke
