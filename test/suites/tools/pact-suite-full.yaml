apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: pact-workflow-suite
  labels:
    core-tests: workflows-suite
    type: suite
    tool: pact
    area: tools
  annotations:
    testkube.io/description: "Groups the Pact JS workflow, to check the Pact integration."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: pact-js-workflow-smoke