apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: cypress-workflow-suite-small
  labels:
    core-tests: workflows-suite
    type: suite
    tool: cypress
    area: tools
  annotations:
    testkube.io/description: "Groups 5 Cypress workflows as a fast check of the Cypress integration: smoke, matrix with JUnit, negative step and templates."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: cypress-workflow-smoke
      - name: cypress-workflow-smoke-negative
      - name: cypress-workflow-smoke-template
      - name: cypress-workflow-smoke-template-checkout-on-step
      - name: cypress-workflow-smoke-matrix-junit
