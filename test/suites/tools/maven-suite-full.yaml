apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: maven-workflow-suite
  labels:
    core-tests: workflows-suite
    type: suite
    tool: maven
    area: tools
  annotations:
    testkube.io/description: "Groups the Maven workflows, to check plain and template Maven runs."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: maven-workflow-smoke-jdk11
      - name: maven-workflow-smoke-jdk11-from-template
