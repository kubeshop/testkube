apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: pytest-workflow-suite
  labels:
    core-tests: workflows-suite
    type: suite
    tool: pytest
  annotations:
    testkube.io/description: "Suite that runs the passing pytest workflows, with and without a JUnit report."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: pytest-workflow-smoke
      - name: pytest-workflow-smoke-junit-success-only
