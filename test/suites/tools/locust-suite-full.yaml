apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: locust-workflow-suite
  labels:
    core-tests: workflows-suite
    type: suite
    tool: locust
  annotations:
    testkube.io/description: "Groups the Locust workflows, to check plain and distributed Locust runs."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: locust-workflow-smoke
      - name: distributed-locust-workflow-smoke
