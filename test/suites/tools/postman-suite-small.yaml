apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: postman-workflow-suite-small
  labels:
    core-tests: workflows-suite
    type: suite
    tool: postman
  annotations:
    testkube.io/description: "Suite that runs the Postman smoke workflow and its template variant."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: postman-workflow-smoke
      - name: postman-workflow-smoke-template
