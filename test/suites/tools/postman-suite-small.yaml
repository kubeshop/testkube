apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: postman-workflow-suite-small
  labels:
    core-tests: workflows-suite
    type: suite
    tool: postman
    area: tools
  annotations:
    testkube.io/description: "Groups 2 Postman workflows as a fast check: plain and template runs."
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: postman-workflow-smoke
      - name: postman-workflow-smoke-template
