apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: robotframework-workflow-suite
  labels:
    core-tests: workflows-suite
    type: suite
    tool: robotframework
    area: tools
  annotations:
    testkube.io/description: "Groups the Robot Framework workflow, to check the Robot Framework integration."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: robotframework-browser-smoke
