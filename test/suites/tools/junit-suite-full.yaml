apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: junit-workflow-suite
  labels:
    core-tests: workflows-suite
    type: suite
    tool: junit
    area: tools
  annotations:
    testkube.io/description: "Groups the JUnit 5 workflow, to check the JUnit 5 integration."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: junit5-workflow-smoke
