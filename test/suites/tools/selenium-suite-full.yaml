apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: selenium-workflow-suite
  labels:
    core-tests: workflows-suite
    type: suite
    tool: selenium
  annotations:
    testkube.io/description: "Groups all 6 Selenium workflows, to check Java, Python and JavaScript Selenium against a standalone Chrome and a hub with nodes."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: selenium-java-workflow-smoke
      - name: selenium-java-hub-and-nodes-workflow-smoke
      - name: selenium-python-workflow-smoke
      - name: selenium-python-hub-and-nodes-workflow-smoke
      - name: selenium-js-mocha-workflow-smoke
      - name: selenium-js-cucumber-workflow-smoke