apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: playwright-workflow-suite-small
  labels:
    core-tests: workflows-suite
    type: suite
    tool: playwright
    area: tools
  annotations:
    testkube.io/description: "Groups 2 Playwright workflows as a fast check: sharding with JUnit and command args."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: playwright-workflow-smoke-command-args
      - name: distributed-playwright-workflow-smoke-junit
