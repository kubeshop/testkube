apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: junit-reports-workflow-suite
  labels:
    core-tests: workflows-suite
    type: suite
    tool: junit-reports
description: "JUnit reports - some of them are expected to fail"
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: cypress-workflow-smoke-junit-report
      - name: cypress-workflow-smoke-matrix-junit
      - name: distributed-playwright-workflow-smoke
      - name: junit5-workflow-smoke
      - name: nunit-workflow-smoke
      - name: playwright-workflow-smoke
      - name: postman-workflow-smoke-junit
      - name: pytest-workflow-smoke-junit-mixed-failures
      - name: pytest-workflow-smoke-junit-random-failures
      - name: pytest-workflow-smoke-junit-success-only
      - name: xunit-workflow-smoke
      - name: junit-report-high-level-failure
      - name: junit-report-high-level-testcase-both-error-and-failure
      - name: junit-report-high-level-without-testcases
      # Connected mode only: a standalone agent rejects a testCases policy.
      - name: junit5-workflow-testcases-mute-all
      - name: junit5-workflow-testcases-mute-partial
      - name: junit5-workflow-testcases-missing-report
      - name: junit5-workflow-testcases-threshold-met
      - name: junit5-workflow-testcases-enforce-always
      - name: junit5-workflow-testcases-narrowing-retry
      - name: junit5-workflow-testcases-rerun-target