apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: selenium-workflow-suite-small
  labels:
    core-tests: workflows-suite
    type: suite
    tool: selenium
  annotations:
    testkube.io/description: "Suite that runs 3 Selenium workflows: Java standalone, JavaScript Mocha standalone and Python with a hub and Chrome nodes."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: selenium-java-workflow-smoke
      - name: selenium-python-hub-and-nodes-workflow-smoke
      - name: selenium-js-mocha-workflow-smoke