apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: selenium-workflow-suite-small
  labels:
    core-tests: workflows-suite
    type: suite
    tool: selenium
    area: tools
  annotations:
    testkube.io/description: "Groups 3 Selenium workflows as a fast check of the Selenium integration with a standalone Chrome and with a hub."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: selenium-java-workflow-smoke
      - name: selenium-python-hub-and-nodes-workflow-smoke
      - name: selenium-js-mocha-workflow-smoke