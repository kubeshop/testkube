kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: junit-report-high-level-failure
  labels:
    category: unit-component-testing
    core-tests: junit-pregenerated
    junit: "true"
    area: reports
  annotations:
    testkube.io/description: "Publishes a pregenerated JUnit report with a failure at the test suite level, to check how Testkube parses it."
    testkube.io/areas: reports,artifacts
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/junit-pregenerated-reports/high-level-failure.xml
  container:
    workingDir: /data/repo/test/special-cases/test-workflows/junit-reports
    image: alpine:3.21.2
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - name: Step
    shell: echo "Step"
    artifacts:
      paths:
        - /data/repo/test/junit-pregenerated-reports/*
---
