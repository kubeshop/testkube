apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: playwright
  labels:
    category: e2e-ui-testing
    core-tests: workflows
    artifacts: "true"
    area: tools
  annotations:
    testkube.io/description: "Example that shows how to run Playwright tests in Testkube and keep the HTML report."
    testkube.io/areas: tools,artifacts
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/playwright/playwright-project
  container:
    resources:
      requests:
        cpu: 1500m
        memory: 2Gi
    workingDir: /data/repo/test/playwright/playwright-project
    image: mcr.microsoft.com/playwright:v1.56.1
  steps:
  - name: Install dependencies
    shell: npm ci
  - name: Run tests
    shell: npx playwright test
  - name: Save artifacts
    workingDir: /data/repo/test/playwright/playwright-project
    artifacts:
      paths:
      - playwright-report/**/*
