apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: k6-perf-test-workers
  labels:
    category: performance-testing
    area: parallel
  annotations:
    testkube.io/description: "Example that shows how to split a k6 performance test across parallel workers with execution segments."
    testkube.io/areas: parallel,artifacts,tools
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  config:
    vus: {type: integer, default: 20}
    duration: {type: string, default: '1m'}
    workers: {type: integer, default: 3}
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/k6/k6-perf-test.js
  steps:
  - name: Run test
    parallel:
      count: 'config.workers'
      transfer:
      - from: /data/repo
      fetch:
      - from: /data/artifacts
      use:
      - name: distribute/evenly
      container:
        resources:
          requests:
            cpu: 15
            memory: 25Gi
      paused: true # synchronise running all workers
      run:
        image: grafana/k6:0.49.0
        workingDir: /data/repo/test/k6
        shell: mkdir /data/artifacts && k6 run k6-perf-test.js --vus {{ config.vus }} --duration {{ config.duration }} --execution-segment '{{ index }}/{{ count }}:{{ index + 1 }}/{{ count }}' --summary-export /data/artifacts/summary-worker-{{ index + 1 }}.json
        env:
        - name: K6_WEB_DASHBOARD
          value: "true"
        - name: K6_WEB_DASHBOARD_EXPORT
          value: "/data/artifacts/k6-test-report-worker-{{ index + 1}}.html"
    artifacts:
      workingDir: /data/artifacts
      paths:
      - '*.html'
      - '*.json'
---
