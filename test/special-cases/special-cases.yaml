    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    env:
      - name: TEMPLATE_GLOBAL_ENV
        value: "template-global-env-value"
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-step-env-override
  labels:
    core-tests: special-cases
    area: engine
  annotations:
    testkube.io/description: "Checks env values set on the container, in steps, in services, in parallel workers and from a template, and how each one overrides the others."
    testkube.io/areas: engine,parallel,services
    testkube.io/cost: medium
    testkube.io/sandbox: ok
description: "ENV override - container ENV vs expression ENV in steps, services and parallel"
spec:
  use:
    - name: special-cases-template-with-env
    - name: special-cases-template-default-resources
  container:
    image: alpine:3.22.0
    env:
      - name: EXAMPLE_ENV
        value: "global"
        global: true
  services:
    echo-service:
      image: alpine:3.22.0
      env:
        - name: EXAMPLE_ENV
          value: "service-env"
      shell: |
        echo "Service Literal: $EXAMPLE_ENV"
        echo "Service Expression: {{ env.EXAMPLE_ENV }}"
        [ "$EXAMPLE_ENV" = "service-env" ] && [ "{{ env.EXAMPLE_ENV }}" = "service-env" ] && echo SERVICE OK || (echo SERVICE FAIL && exit 1)
  steps:
    - name: Check global ENV
      run:
        shell: |
          echo "Step Literal: $EXAMPLE_ENV"
          echo "Step Expression: {{ env.EXAMPLE_ENV }}"
          [ "$EXAMPLE_ENV" = "global" ] && [ "{{ env.EXAMPLE_ENV }}" = "global" ] && echo OK || (echo FAIL && exit 1)
    - name: Check overridden ENV
      run:
        env:
          - name: EXAMPLE_ENV
            value: "step-local"
        shell: |
          echo "Step Literal: $EXAMPLE_ENV"
          echo "Step Expression: {{ env.EXAMPLE_ENV }}"
          [ "$EXAMPLE_ENV" = "step-local" ] && [ "{{ env.EXAMPLE_ENV }}" = "step-local" ] && echo OK || (echo FAIL && exit 1)
    - name: Parallel ENV checks
      parallel:
        steps:
          - name: Check global (parallel)
            run:
              shell: |
                echo "Parallel Literal: $EXAMPLE_ENV"
                echo "Parallel Expression: {{ env.EXAMPLE_ENV }}"
                [ "$EXAMPLE_ENV" = "global" ] && [ "{{ env.EXAMPLE_ENV }}" = "global" ] && echo OK || (echo FAIL && exit 1)

          - name: Check overridden (parallel)
            run:
              env:
                - name: EXAMPLE_ENV
                  value: "parallel-override"
              shell: |
                echo "Parallel Literal: $EXAMPLE_ENV"
                echo "Parallel Expression: {{ env.EXAMPLE_ENV }}"
                [ "$EXAMPLE_ENV" = "parallel-override" ] && [ "{{ env.EXAMPLE_ENV }}" = "parallel-override" ] && echo OK || (echo FAIL && exit 1)
    - name: Check global ENV from template
      run:
        shell: |
          echo "TEMPLATE ENV Literal: $TEMPLATE_GLOBAL_ENV"
          echo "TEMPLATE ENV Expression: {{ env.TEMPLATE_GLOBAL_ENV }}"
          [ "$TEMPLATE_GLOBAL_ENV" = "template-global-env-value" ] && [ "{{ env.TEMPLATE_GLOBAL_ENV }}" = "template-global-env-value" ] && echo OK || (echo FAIL && exit 1)
    - name: Override global ENV from template
      run:
        env:
          - name: TEMPLATE_GLOBAL_ENV
            value: "template-global-env-override"
        shell: |
          echo "TEMPLATE ENV Literal: $TEMPLATE_GLOBAL_ENV"
          echo "TEMPLATE ENV Expression: {{ env.TEMPLATE_GLOBAL_ENV }}"
          [ "$TEMPLATE_GLOBAL_ENV" = "template-global-env-override" ] && [ "{{ env.TEMPLATE_GLOBAL_ENV }}" = "template-global-env-override" ] && echo OK || (echo FAIL && exit 1)
---
apiVersion: testworkflows.testkube.io/v1
