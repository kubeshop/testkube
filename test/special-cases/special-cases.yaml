apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-step-retry
  labels:
    core-tests: special-cases
    area: engine
  annotations:
    testkube.io/description: "Checks that a retry policy repeats a step that fails at random until it passes, so the execution passes."
    testkube.io/cost: light
    testkube.io/sandbox: ok
description: "step retry (until step passed)"
spec:
  use:
    - name: special-cases-template-default-resources
  container:
    image: alpine:3.22.0
  job:
    activeDeadlineSeconds: 30
  steps:
  - name: Random pass/fail
    retry:
      count: 20
      until: self.passed
    shell: |
      code=$((RANDOM % 2))
      [[ $code -eq 0 ]] && echo "random - passed" || echo "random - failed"
      exit $code
---
