metadata:
  name: special-cases-template-default-resources
  labels:
    core-tests: special-cases-template
    area: engine
  annotations:
    testkube.io/description: "Template that sets the default container resources for the special-cases workflows."
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-global-env
  labels:
    core-tests: special-cases
    area: engine
  annotations:
    testkube.io/description: "Checks that a global env value reaches the main pod, the services and the parallel workers, and that a non-global value stays local."
    testkube.io/areas: engine,services,parallel
    testkube.io/cost: medium
    testkube.io/sandbox: ok
description: "Global ENV - set for both pods and slave pods"
spec:
  use:
    - name: special-cases-template-default-resources
  container:
    image: alpine:3.22.0
    env:
    - name: EXAMPLE_GLOBAL_ENV
      value: "GLOBAL_ENV_VALUE"
      global: true
    - name: EXAMPLE_NON_GLOBAL_ENV
      value: "NON_GLOBAL_ENV_VALUE"
  services:
    service:
      image: alpine:3.22.0
      logs: always
      count: 1
      shell: |
        if [ "${EXAMPLE_GLOBAL_ENV}" = "GLOBAL_ENV_VALUE" ] && \
          [ "${EXAMPLE_NON_GLOBAL_ENV+x}" = "" ]; then
          echo ENV values: OK
          exit 0
        else
          echo ENV validation failed
          exit 1
        fi
  job:
    activeDeadlineSeconds: 30
  steps:
  - name: Step
    run:
      shell: |
        if [ "${EXAMPLE_GLOBAL_ENV}" = "GLOBAL_ENV_VALUE" ] && \
          [ "${EXAMPLE_NON_GLOBAL_ENV}" = "NON_GLOBAL_ENV_VALUE" ]; then
          echo ENV values: OK
          exit 0
        else
          echo ENVs validation failed
          exit 1
        fi
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflowTemplate
metadata:
  name: special-cases-template-with-env
  labels:
