apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-workingdir-override
  labels:
    core-tests: special-cases
    area: engine
  annotations:
    testkube.io/description: "Checks the default workingDir and a workingDir that a step overrides."
    testkube.io/cost: light
    testkube.io/sandbox: ok
description: "workingDir - override at step level"
spec:
  use:
    - name: special-cases-template-default-resources
  container:
    image: alpine:3.22.0
    workingDir: /data/global
  steps:
    - name: Create directories
      shell: mkdir -p /data/global /data/custom

    - name: Check default workingDir
      shell: |
        echo "PWD: $(pwd)"
        [ "$(pwd)" = "/data/global" ] && echo OK || (echo FAIL && exit 1)

    - name: Check overridden workingDir
      workingDir: /data/custom
      shell: |
        echo "PWD: $(pwd)"
        [ "$(pwd)" = "/data/custom" ] && echo OK || (echo FAIL && exit 1)
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-securitycontext-runasuser-runasgroup
  labels:
    core-tests: special-cases
    area: engine
  annotations:
    testkube.io/description: "Checks that runAsUser and runAsGroup of the securityContext apply to the steps, the services and the parallel workers."
    testkube.io/areas: engine,parallel,services
    testkube.io/cost: medium
    testkube.io/sandbox: ok
description: "securityContext - runAsUser and runAsGroup"
spec:
  use:
    - name: special-cases-template-default-resources
  container:
    image: alpine:3.22.0
    securityContext:
      runAsUser: 128
      runAsGroup: 256
  services:
    slave:
      use:
      - name: distribute/evenly
      image: alpine:3.22.0
      logs: always
      count: 2
      securityContext:
        runAsUser: 512
        runAsGroup: 1024
      shell: |
        if [ "$(id -u)" = "512" ] && [ "$(id -g)" = "1024" ]; then
          echo UID/GUID correct
          exit 0
        else
          echo UID/GUID incorrect!
          exit 1
        fi
  job:
    activeDeadlineSeconds: 60
  steps:
  - name: Step
    run:
      shell: |
        if [ "$(id -u)" = "128" ] && [ "$(id -g)" = "256" ]; then
          echo UID/GUID correct
          exit 0
        else
          echo UID/GUID incorrect!
          exit 1
        fi
  - name: Parallel ENV checks
    parallel:
      count: 1
      steps:
        - name: Parallel step
          run:
            securityContext:
              runAsUser: 500
              runAsGroup: 1000
            shell: |
              if [ "$(id -u)" = "500" ] && [ "$(id -g)" = "1000" ]; then
                echo UID/GUID correct
                exit 0
              else
                echo UID/GUID incorrect!
                exit 1
              fi
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-multiple-git-repositories-custommountpath
  labels:
    core-tests: special-cases
    area: engine
  annotations:
    testkube.io/description: "Checks that a step can check out a second Git repository at a custom mount path and use files from both repositories."
    testkube.io/cost: light
    testkube.io/sandbox: ok
description: "Git - multiple repositories (one on step level), custom mountPath"
spec:
  use:
    - name: special-cases-template-default-resources
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      mountPath: /data/repo-k6/
      paths:
      - test/k6/k6-smoke-test-without-envs.js
  container:
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
  job:
    activeDeadlineSeconds: 60
  steps:
  - name: Run k6 test
    workingDir: /data/repo-k6/test/k6
    run:
      image: grafana/k6:0.43.1
      shell: k6 run k6-smoke-test-without-envs.js
  - name: Checkout second repo - Postman
    content:
      git:
        uri: https://github.com/kubeshop/testkube
        revision: main
        mountPath: /data/repo-postman/
        paths:
        - test/postman/postman-executor-smoke-without-envs.postman_collection.json
    steps:
    - name: Run postman test
      workingDir: /data/repo-postman/test/postman
      run:
        image: postman/newman:6-alpine
        shell: newman run postman-executor-smoke-without-envs.postman_collection.json
---
