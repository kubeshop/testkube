apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-parallel-steps
  labels:
    core-tests: special-cases
    area: parallel
  annotations:
    testkube.io/description: "Checks that files written by parallel workers are fetched back to the main pod."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  config:
    workers:
      type: integer
      default: 3
  container:
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: mkdir /data/parallel
    shell: mkdir -p /data/parallel
  - name: Run test
    parallel:
      count: 'config.workers'
      fetch:
      - from: /data/parallel
      use:
      - name: distribute/evenly
      container:
        resources:
          requests:
            cpu: 128m
            memory: 128Mi
      run:
        image: alpine:3.22.0
        shell: |
          mkdir -p /data/parallel && touch /data/parallel/{{ index }}.txt && echo "File {{ index }}" > /data/parallel/{{ index }}.txt
  - name: Validate files
    shell: |
      ls -lah /data/parallel
      WORKERS={{ config.workers }}
      for i in $(seq 0 $((WORKERS - 1))); do
        if [ -f /data/parallel/$i.txt ] && grep -qx "File $i" /data/parallel/$i.txt; then
          echo "File $i validation: OK"
        else
          echo "File $i validation: FAIL"
          exit 1
        fi
      done
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-parallel-steps-matrix
  labels:
    core-tests: special-cases
    area: parallel
  annotations:
    testkube.io/description: "Checks that files written by parallel workers of a matrix are fetched back to the main pod."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: mkdir /data/parallel
    shell: mkdir -p /data/parallel
  - name: Run test
    parallel:
      matrix:
        name: ["0", "1", "2"]
      fetch:
      - from: /data/parallel
      use:
      - name: distribute/evenly
      container:
        resources:
          requests:
            cpu: 128m
            memory: 128Mi
      run:
        image: alpine:3.22.0
        shell: |
          mkdir -p /data/parallel && touch /data/parallel/{{ matrix.name }}.txt && echo "File {{ matrix.name }}" > /data/parallel/{{ matrix.name }}.txt
  - name: Validate files
    shell: |
      ls -lah /data/parallel
      WORKERS=3
      for i in $(seq 0 $((WORKERS - 1))); do
        if [ -f /data/parallel/$i.txt ] && grep -qx "File $i" /data/parallel/$i.txt; then
          echo "File $i validation: OK"
        else
          echo "File $i validation: FAIL"
          exit 1
        fi
      done
---
# failFast=false (default) waits for all workers to complete
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-parallel-steps-fail-fast-disabled
  labels:
    core-tests: special-cases
    area: parallel
  annotations:
    testkube.io/description: "Checks that with failFast off, the other parallel workers complete when one worker fails at once."
    testkube.io/cost: light
    testkube.io/sandbox: ok
description: "parallel failFast disabled (default) - all workers complete even if one fails quickly"
spec:
  container:
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
  job:
    activeDeadlineSeconds: 60
  steps:
  - name: mkdir /data/parallel
    shell: mkdir -p /data/parallel
  - name: Run parallel with failFast disabled
    negative: true
    parallel:
      count: 3
      fetch:
      - from: /data/parallel
      container:
        resources:
          requests:
            cpu: 128m
            memory: 128Mi
      run:
        image: alpine:3.22.0
        shell: |
          mkdir -p /data/parallel
          if [ "{{ index }}" = "0" ]; then echo "worker 0 failing" && exit 1; fi
          touch /data/parallel/{{ index }}.txt && echo "worker {{ index }} completed"
  - name: Validate non-failing workers completed
    shell: |
      for i in 1 2; do
        if [ -f /data/parallel/$i.txt ]; then
          echo "Worker $i: completed"
        else
          echo "Worker $i: MISSING - was incorrectly aborted"
          exit 1
        fi
      done
