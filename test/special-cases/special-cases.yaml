apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-config-override-target # don't target it specifically - just a dependency for special-cases-config-override
  labels:
    core-tests: special-cases
    area: engine
  annotations:
    testkube.io/description: "Passes only with config values that override its defaults; special-cases-config-override starts it, so do not run it alone."
    testkube.io/areas: engine,parallel,services
    testkube.io/cost: medium
    testkube.io/sandbox: ok
description: "Shouldn't be triggered directly (will fail then) - requires specific config overrides to pass"
spec:
  use:
    - name: special-cases-template-default-resources
  config:
    service_count: {type: integer, default: -1}
    workers: {type: integer, default: -1}
    step_validation: {type: string, default: "default_value"}
  container:
    image: alpine:3.22.0
  services:
    service:
      image: alpine:3.22.0
      logs: always
      count: 'config.service_count'
      shell: echo "Service" && exit 0
  job:
    activeDeadlineSeconds: 60
  steps:
  - name: Step
    shell: |
      STEP_VALIDATION="{{ shellquote(config.step_validation) }}"
      echo "$STEP_VALIDATION"
      [ "$STEP_VALIDATION" = "override" ] && exit 0 || { echo "validation failed"; exit 1; }
  - name: Parallel step
    parallel:
      count: 'config.workers'
      run:
        image: alpine:3.22.0
        shell: echo "Parallel step" && exit 0
---
