    resources:
      requests:
        cpu: 128m
        memory: 128Mi
  job:
    activeDeadlineSeconds: 120
  steps:
  - name: Run test
    parallel:
      failFast: true
      count: 4
      container:
        resources:
          requests:
            cpu: 128m
            memory: 128Mi
      run:
        image: alpine:3.22.0
        shell: |
