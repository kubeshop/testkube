apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: expected-fail-step-retry
  labels:
    core-tests: expected-fail
    area: engine
  annotations:
    testkube.io/description: "Expected to fail: a retry policy runs the step until it fails; it passes twice, fails on the third attempt, and the execution fails."
    testkube.io/cost: light
    testkube.io/sandbox: ok
description: "step retry (until step failed)"
spec:
  use:
    - name: special-cases-template-default-resources
  container:
    image: alpine:3.22.0
  job:
    activeDeadlineSeconds: 30
  steps:
  - name: Pass twice, then fail
    retry:
      count: 20
      until: self.failed
    shell: |
      # All attempts run in the same container, so the file keeps the count.
      attempt=$(( $(cat /tmp/attempt 2>/dev/null || echo 0) + 1 ))
      echo "$attempt" > /tmp/attempt
      echo "attempt $attempt"
      [ "$attempt" -lt 3 ]
---
