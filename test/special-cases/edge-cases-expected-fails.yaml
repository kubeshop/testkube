apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: expected-fail-cypress-incorrect-repo-path
  labels:
    core-tests: expected-fail
    area: engine
  annotations:
    testkube.io/description: "Expected to fail: the Git checkout path does not exist; without cone mode the checkout passes and the Cypress step fails."
    testkube.io/areas: engine,artifacts
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
description: default no-cone mode
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/cypress/some-incorrect-path # no-cone won't fail here
  container:
    resources:
      requests:
        cpu: 2
        memory: 2Gi
    workingDir: /data/repo/test/cypress/some-incorrect-path
  steps:
  - name: Run tests
    run:
      image: cypress/included:13.6.4
      args:
      - --env
      - NON_CYPRESS_ENV=NON_CYPRESS_ENV_value
      - --config
      - '{"screenshotsFolder":"/data/artifacts/screenshots","videosFolder":"/data/artifacts/videos"}'
      env:
      - name: CYPRESS_CUSTOM_ENV
        value: CYPRESS_CUSTOM_ENV_value
    artifacts:
      workingDir: /data/artifacts
      paths:
      - '**/*'
---
