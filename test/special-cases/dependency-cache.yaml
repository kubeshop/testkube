# Step dependency cache - the two sharing scopes.
#
# A step's `cache` block restores directories from object storage before the step runs
# and saves them back once the step passes, so dependency installs survive between
# executions. Both workflows below are safe to run repeatedly: a cache is an
# optimization, so a miss just means the install happens over the network, exactly as it
# would without any cache.
#
# Both also cache the package manager's own store rather than the tree it installs -
# npm's _cacache, Go's cache/download - and that is the one choice here worth copying.
# A cache is bound by how many entries it holds and not by how many bytes: packing and
# restoring both spend their time per file. A store is a few thousand larger,
# already-compressed files; the installed tree beside it is tens of thousands of small
# ones and is derived from the store anyway. Measured on the Go workflow below, moving
# from one to the other took the save from 36.6s to 9.2s and the restore from 38.6s to
# 5.2s, while the archive itself only halved - the difference is all entry count.
#
# Each workflow proves the "derived" half rather than asserting it, by deleting the
# installed tree and rebuilding it from the store with the network turned off.
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-cache-workflow-scope
  labels:
    core-tests: special-cases
description: "Dependency cache, workflow scope - npm's package store keyed on a lockfile, private to this workflow"
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - js
  container:
    image: node:22-alpine
    resources:
      requests:
        cpu: 256m
        memory: 256Mi
    # hash_files() resolves against this directory.
    workingDir: /data/repo/js
    # Stated rather than inherited, for the same reason the workflow below states
    # GOMODCACHE: the cached path has to be somewhere this workflow decided, not
    # wherever the image happens to put it.
    env:
    - name: npm_config_cache
      value: /root/.npm
  job:
    activeDeadlineSeconds: 600
  steps:
  - name: Install dependencies
    cache:
      # The key is what makes the entry correct rather than merely fast: it digests the
      # lockfile's *contents*, so editing a dependency produces a different key and the
      # stale tree is never restored. Prefer hash_files over hash(glob(...)), which
      # digests the matched paths and so does not change when a file's contents do.
      # See the version note in the workflow below: the segment is a cache-key version,
      # and bumping it is the only way past entries stored under the old one, because an
      # entry cannot be rewritten. v3 is the move to _cacache below.
      key: 'npm-v3-{{ hash_files("package-lock.json") }}'
      # Tried in order when the exact key misses, newest entry first within a prefix. A
      # partial hit still saves under the exact key afterwards, so the next run hits.
      restoreKeys:
      - 'npm-v3-'
      paths:
      # npm's own content-addressed store, not the node_modules it installs. Same
      # reasoning as cache/download in the workflow below, and the same measurement
      # behind it: a cache is bound by how many entries it has, and an installed tree
      # is tens of thousands of small files where the store is a few thousand larger,
      # already-compressed ones. node_modules is derived from this; `npm ci` rebuilds
      # it, and the shell below proves it can do so with the network off.
      #
      # Note this path needs a volume of its own, where node_modules sat inside the
      # repository checkout and reused that one. Both cases are covered by
      # TestProcessCache_MountsUncoveredPaths.
      - /root/.npm/_cacache
      # The default. Stated here only to contrast with the workflow below: entries are
      # private to this workflow, so nothing another workflow writes can be restored
      # into this one.
      scope: workflow
    shell: |
      set -e
      # `npm ci` needs no cache to work - it just gets slower without one, which is the
      # whole point of the feature degrading to a miss rather than failing.
      npm ci --prefer-offline --no-audit --fund=false

      # Non-empty, so that a save cannot store an empty store. Note what this still
      # cannot check: `npm ci` repopulates both whether or not the restore brought
      # anything back, so nothing in a single execution can tell a hit from a miss.
      # tw-cache-roundtrip in test/suites is where that is asserted, by running twice.
      [ -n "$(ls -A /root/.npm/_cacache 2>/dev/null)" ] || { echo "FAIL: the npm store is empty after install"; exit 1; }
      echo "/root/.npm/_cacache is $(du -sh /root/.npm/_cacache | cut -f1) in $(find /root/.npm/_cacache -type f | wc -l) files"
      echo "node_modules, left uncached, is $(du -sh node_modules | cut -f1) in $(find node_modules -type f | wc -l) files"

      # The claim that makes caching the store rather than the tree correct, executed
      # rather than asserted: with node_modules gone and the network off, `npm ci`
      # rebuilds it from _cacache alone. --offline rather than --prefer-offline, because
      # the point is that it must not be allowed to reach the registry and quietly pass.
      rm -rf node_modules
      npm ci --offline --no-audit --fund=false \
        || { echo "FAIL: _cacache alone did not satisfy the lockfile"; exit 1; }
      echo "reinstalled the whole lockfile offline from _cacache alone"

  - name: Report what the cache did
    shell: |
      # Both stages log a line of their own ("cache: hit ...", "cache: miss ..."), so a
      # cold first run and a warm second run are visible in the step logs.
      echo "installed $(ls node_modules | wc -l) top-level packages"

---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: special-cases-cache-environment-scope
  labels:
    core-tests: special-cases
description: "Dependency cache, environment scope - a Go module cache shared with every workflow in the environment"
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - go.mod
      - go.sum
  container:
    image: golang:1.26-alpine
    resources:
      requests:
        cpu: 512m
        memory: 1Gi
    workingDir: /data/repo
    # Stated rather than assumed, and this is not housekeeping: the official golang
    # images set GOPATH=/go, so the module cache lands in /go/pkg/mod and nothing is
    # ever written to $HOME/go/pkg/mod - which is where a cache block naming the Go
    # default would point. Naming the directories here makes the paths below true
    # instead of leaving them to an image detail that can change under the workflow.
    env:
    - name: GOMODCACHE
      value: /root/go/pkg/mod
    - name: GOCACHE
      value: /root/.cache/go-build
  job:
    activeDeadlineSeconds: 900
  steps:
  - name: Warm the module cache
    cache:
      # The version segment is bumped whenever what gets stored under the key changes
      # shape. It has to be, because an entry is immutable for its lifetime: entries
      # written under the old shape still answer the old key, and a restoreKeys prefix
      # would keep matching them. Versioning the prefix is how a cache is invalidated
      # when nothing about go.sum changed - v3 is the move to cache/download below.
      key: 'gomod-v3-{{ hash_files("go.sum") }}'
      restoreKeys:
      - 'gomod-v3-'
      # Neither path sits inside a volume the step already has, so a volume is mounted
      # at each one automatically - without that they would be restored into the restore
      # container's own filesystem, where the container running the build cannot see
      # them. Set `mount: false` only for a path that is already covered, for instance
      # one inside the repository checkout; on an uncovered path it is refused rather
      # than silently doing nothing.
      paths:
      # cache/download and not the whole module cache, because both halves of a cache
      # scale with the number of entries and not with the bytes. Measured on this
      # workflow: /root/go/pkg/mod is 2.2G across 98370 files, of which cache/download
      # is 479M across 4927 files - twenty times fewer entries and a fifth of the size.
      #
      # What that bought, measured on the same workflow: the save went from 36.6s
      # (29.2s packing, 7.4s uploading, 893 MB) to 9.2s (4.4s packing, 4.8s uploading,
      # 471 MB), and the restore from 38.6s to 5.2s. Packing improved by more than the
      # size did, which is the point: it was spending its time on the file count.
      #
      # Nothing is lost by leaving the rest out. cache/download holds the module zips
      # and their metadata and is the authoritative store; the extracted
      # <module>@<version> trees beside it are derived from those zips, and Go
      # re-extracts them on demand. The shell below proves that rather than asserting
      # it, by deleting them and resolving again with the network turned off.
      #
      # The zips are also already compressed, so the archive is close to the same size
      # as the directory and the compressor has almost nothing to do.
      - /root/go/pkg/mod/cache/download
      - /root/.cache/go-build
      # Shared with every workflow in the environment, so two workflows that build the
      # same module set download it once between them.
      #
      # This widens a trust boundary, not just a cache. Any workflow that may write this
      # scope can influence what every other workflow in the environment restores, and a
      # restored dependency tree is code that later runs. Use it where every workflow in
      # the environment is equally trusted; keep the default `workflow` scope otherwise.
      # Entries are immutable for their lifetime, so the first writer of a given key
      # wins and a later run cannot swap out what it stored.
      scope: environment
    shell: |
      set -e
      go mod download all
      # Something has to actually compile, or GOCACHE is stored empty: a module
      # download fills GOMODCACHE and leaves the build cache untouched. It cannot be a
      # package from the repository - the content above checks out go.mod and go.sum
      # and nothing else - so a throwaway module is built instead, which is enough to
      # compile the standard library packages it pulls in.
      mkdir -p /tmp/warm
      cd /tmp/warm
      go mod init warm >/dev/null
      printf 'package main\n\nimport "fmt"\n\nfunc main() { fmt.Println("warm") }\n' > main.go
      go build -o /dev/null .
      cd /data/repo

      # Non-empty, not merely present. `test -d` would pass on its own: the cache
      # mounts a volume at every path it manages, so both directories exist before
      # anything runs, whether or not a single byte was written to them. That is what
      # let this workflow report success while caching nothing at all.
      for dir in /root/go/pkg/mod/cache/download /root/.cache/go-build; do
        [ -n "$(ls -A "$dir" 2>/dev/null)" ] || { echo "FAIL: $dir is empty, so there is nothing to cache"; exit 1; }
        echo "$dir is $(du -sh "$dir" | cut -f1) in $(find "$dir" -type f | wc -l) files"
      done
      echo "left uncached: $(find /root/go/pkg/mod -maxdepth 1 -mindepth 1 ! -name cache -type d | wc -l) extracted module trees"

      # The claim that makes caching only cache/download correct, executed rather than
      # asserted: with the extracted trees deleted and the network off, everything still
      # resolves, because the zips are all Go needs. If this ever stops holding, the
      # cached paths above are wrong and this is where it surfaces.
      find /root/go/pkg/mod -maxdepth 1 -mindepth 1 ! -name cache -exec rm -rf {} \;
      GOPROXY=off GOFLAGS=-mod=mod go mod download all \
        || { echo "FAIL: cache/download alone did not satisfy the module graph"; exit 1; }
      echo "resolved the whole module graph offline from cache/download alone"
