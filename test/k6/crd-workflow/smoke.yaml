apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: k6-workflow-smoke
  labels:
    core-tests: workflows
    tool: k6
    artifacts: "true"
    category: performance-testing
    area: tools
  annotations:
    testkube.io/description: "Checks that Testkube runs a k6 1.1.0 script with env values from the container and from args and keeps the summary JSON."
    testkube.io/icon: k6
    testkube.io/areas: tools,artifacts
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/k6/k6-smoke-test.js
  container:
    image: grafana/k6:1.1.0
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
    workingDir: /data/repo/test/k6
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: Run test
    steps:
    - shell: mkdir /data/artifacts
    - run:
        shell: k6 run k6-smoke-test.js -e K6_ENV_FROM_PARAM=K6_ENV_FROM_PARAM_value --duration 30s --summary-export /data/artifacts/summary.json
        env:
        - name: K6_SYSTEM_ENV
          value: K6_SYSTEM_ENV_value
        - name: K6_WEB_DASHBOARD
          value: "true"
        - name: K6_WEB_DASHBOARD_EXPORT
          value: "/data/artifacts/k6-test-report.html"
      steps:
      - name: Saving artifacts
        workingDir: /data/artifacts
        artifacts:
          paths:
          - '*'
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: k6-workflow-smoke-template
  labels:
    core-tests: workflows
    tool: k6
    category: performance-testing
    area: tools
  annotations:
    testkube.io/description: "Checks that the official/k6/v1 template runs a k6 script and exports its summary JSON."
    testkube.io/icon: k6
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
    workingDir: /data/repo/test/k6
    env:
    - name: K6_SYSTEM_ENV # currently only possible on this level
      value: K6_SYSTEM_ENV_value
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: Run from template
    workingDir: /data/repo/test/k6
    content:
      git:
        uri: https://github.com/kubeshop/testkube
        revision: main
        paths:
        - test/k6/k6-smoke-test.js
    template:
      name: official/k6/v1
      config:
        version: 1.1.0
        run: "mkdir -p /data/artifacts && k6 run k6-smoke-test.js -e K6_ENV_FROM_PARAM=K6_ENV_FROM_PARAM_value --summary-export /data/artifacts/summary.json"
---
