kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: k6-workflow-smoke-content-file
  labels:
    core-tests: workflows
    tool: k6
    artifacts: "true"
    category: performance-testing
    area: tools
  annotations:
    testkube.io/description: "Checks that a k6 script defined inline as a content file runs without a Git checkout and that its summary is kept."
    testkube.io/icon: k6
    testkube.io/areas: tools,artifacts
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  content:
    files:
      - path: /data/k6-test.js
        content: |-
          import http from 'k6/http';
          import { sleep } from 'k6';
          export default function () {
              http.get('https://testkube-test-page-lipsum.pages.dev');
              sleep(1);
          };
  container:
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
  steps:
    - name: Run Tests
      workingDir: /data
      run:
        image: grafana/k6:1.1.0
        env:
          - name: K6_WEB_DASHBOARD
            value: 'true'
          - name: K6_WEB_DASHBOARD_EXPORT
            value: k6-test-report.html
        shell: k6 run k6-test.js --duration 30s --summary-export summary.json
      artifacts:
        paths:
          - k6-test-report.html
          - summary.json
---
