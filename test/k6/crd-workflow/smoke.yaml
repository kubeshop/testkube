apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: distributed-k6-workflow-smoke
  labels:
    core-tests: workflows
    tool: k6
    category: performance-testing
    area: parallel
  annotations:
    testkube.io/description: "Checks that a k6 load test can be split across parallel workers with distribute/evenly, with VUs, duration and worker count as config."
    testkube.io/icon: k6
    testkube.io/areas: parallel,tools
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  config:
    vus: {type: integer, default: 2}
    duration: {type: string, default: '2s'}
    workers: {type: integer, default: 2}
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/k6/k6-smoke-test.js
  container:
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: Run test
    parallel:
      count: 'config.workers'
      transfer:
      - from: /data/repo
      use:
      - name: distribute/evenly
      container:
        resources:
          requests:
            cpu: 128m
            memory: 128Mi
      paused: true # synchronise running all workers
      run:
        image: grafana/k6:1.1.0
        workingDir: /data/repo/test/k6
        shell: |
          k6 run k6-smoke-test.js \
            -e K6_ENV_FROM_PARAM=K6_ENV_FROM_PARAM_value \
            --vus {{ shellquote(config.vus) }} \
            --duration {{ shellquote(config.duration) }} \
            --execution-segment {{ index }}/{{ count }}:{{ index + 1 }}/{{ count }}
        env:
        - name: K6_SYSTEM_ENV
          value: K6_SYSTEM_ENV_value
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: k6-browser-workflow-smoke
  labels:
    core-tests: workflows
    tool: k6-browser
    artifacts: "true"
    category: performance-testing
    area: tools
  annotations:
    testkube.io/description: "Checks that a k6 browser test runs with the k6 1.3.0 browser image and that its JSON results are kept."
    testkube.io/icon: k6
    testkube.io/areas: tools,artifacts
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
        - test/k6/k6-browser-smoke-test.js
  container:
    image: grafana/k6:1.3.0-with-browser
    workingDir: /data/repo/test/k6
    resources:
      requests:
        cpu: 1000m
        memory: 1Gi
  job:
    activeDeadlineSeconds: 300
  steps:
    - name: Create artifacts directory
      shell: mkdir -p /data/artifacts
    - name: Run test
      run:
        shell: |
          k6 run k6-browser-smoke-test.js --out json=/data/artifacts/k6-browser-result.json --tag test_type=browser
      artifacts:
        paths:
          - '*'
