apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: playwright-workflow-smoke
  labels:
    core-tests: workflows
    tool: playwright
    artifacts: "true"
    junit: "true"
    playwright-traces: "on"
    category: e2e-ui-testing
    area: tools
  annotations:
    testkube.io/description: "Checks that Testkube runs Playwright 1.56.1 tests with traces and keeps the JUnit and HTML reports as artifacts."
    testkube.io/icon: playwright
    testkube.io/areas: tools,reports,artifacts
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/playwright/playwright-project
  container:
    image: mcr.microsoft.com/playwright:v1.56.1
    resources:
      requests:
        cpu: 1500m
        memory: 1500Mi
    workingDir: /data/repo/test/playwright/playwright-project
  job:
    activeDeadlineSeconds:  600
  steps:
  - name: Install dependencies
    shell: "npm ci"
  - name: Run tests
    run:
      shell: "mkdir /data/artifacts && npx playwright test --reporter=list,junit,html --trace on"
      env:
      - name: PLAYWRIGHT_JUNIT_OUTPUT_NAME
        value: "/data/artifacts/junit-report.xml"
      - name: PLAYWRIGHT_HTML_REPORT
        value: /data/artifacts/playwright-report
    steps:
    - name: Save artifacts
      artifacts:
        workingDir: /data/artifacts/
        paths:
        - '**/*'
---
