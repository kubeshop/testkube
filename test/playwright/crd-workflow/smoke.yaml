apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: distributed-playwright-workflow-smoke
  labels:
    core-tests: workflows
    tool: playwright
    artifacts: "true"
    category: e2e-ui-testing
    area: parallel
  annotations:
    testkube.io/description: "Checks that Playwright tests can be sharded across parallel workers and that their blob reports merge into one HTML report."
    testkube.io/icon: playwright
    testkube.io/areas: parallel,artifacts,tools
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/playwright/playwright-project
  container:
    image: mcr.microsoft.com/playwright:v1.56.1
    workingDir: /data/repo/test/playwright/playwright-project
    resources:
      requests:
        cpu: 256m
        memory: 256Mi
  job:
    activeDeadlineSeconds:  600
  steps:
  - name: Install dependencies
    shell: 'npm ci'
  - name: Run tests
    parallel:
      count: 2
      transfer:
      - from: /data/repo
      fetch:
      - from: /data/repo/test/playwright/playwright-project/blob-report
        to: /data/reports
      container:
        resources:
          requests:
            cpu: 1500m
            memory: 1500Mi
      run:
        shell: 'npx playwright test --reporter=blob --shard {{ index + 1 }}/{{ count }}'
  - name: Merge reports
    condition: always
    shell: 'npx playwright merge-reports --reporter=html /data/reports'
    artifacts: # artifacts with fetch from parallel steps
      paths:
      - "playwright-report/**"
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: distributed-playwright-workflow-smoke-junit
  labels:
    core-tests: workflows
    tool: playwright
    artifacts: "true"
    junit: "true"
    category: e2e-ui-testing
    area: parallel
  annotations:
    testkube.io/description: "Checks that Playwright tests can be sharded across parallel workers and that the JUnit report of every shard is collected."
    testkube.io/icon: playwright
    testkube.io/areas: parallel,reports,artifacts,tools
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
description: "Distributed Playwright with `--shard`"
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/playwright/playwright-project
  container:
    image: mcr.microsoft.com/playwright:v1.56.1
    workingDir: /data/repo/test/playwright/playwright-project
    resources:
      requests:
        cpu: 256m
        memory: 256Mi
  job:
    activeDeadlineSeconds:  600
  steps:
  - name: Install dependencies
    shell: 'npm ci'
  - name: Run tests
    parallel:
      description: "Shard: {{ index + 1 }}/{{ count }}"
      count: 2
      transfer:
      - from: /data/repo
      container:
        resources:
          requests:
            cpu: 1500m
            memory: 1500Mi
      run:
        shell: 'mkdir /data/artifacts && npx playwright test --reporter=list,junit --shard={{ index + 1 }}/{{ count }}'
        env:
        - name: PLAYWRIGHT_JUNIT_OUTPUT_NAME
          value: "/data/artifacts/junit-report-{{ index + 1 }}.xml"
      artifacts: # artifacts directly on parallel step
        workingDir: /data/artifacts/
        paths:
        - '**/*'
