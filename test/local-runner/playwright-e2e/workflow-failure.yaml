apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: local-runner-playwright-artifact-failure
  labels:
    app.kubernetes.io/part-of: testkube-local-runner-e2e
spec:
  container:
    image: mcr.microsoft.com/playwright:v1.56.1
    workingDir: /data/repo
  job:
    activeDeadlineSeconds: 300
  steps:
    - name: Install Playwright dependencies
      shell: npm ci
    - name: Run failing browser check with artifacts
      container:
        env:
          - name: EXPECTED_COUNTER
            value: "2"
      shell: npx playwright test
      artifacts:
        workingDir: /data/repo
        paths:
          - test-results/**/*
          - playwright-report/**/*
