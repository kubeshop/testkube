apiVersion: v1
kind: Namespace
metadata:
  name: testkube-local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-playwright-app
  namespace: testkube-local
  labels:
    app.kubernetes.io/name: local-playwright-app
    app.kubernetes.io/part-of: testkube-local-runner-e2e
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Local TestWorkflow Playwright Demo</title>
      </head>
      <body>
        <main>
          <h1>Local TestWorkflow browser check</h1>
          <p id="count" aria-live="polite">0</p>
          <button id="increment" type="button">Increment</button>
        </main>
        <script>
          const count = document.querySelector('#count');
          document.querySelector('#increment').addEventListener('click', () => {
            count.textContent = String(Number(count.textContent) + 1);
          });
        </script>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-playwright-app
  namespace: testkube-local
  labels:
    app.kubernetes.io/name: local-playwright-app
    app.kubernetes.io/part-of: testkube-local-runner-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-playwright-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-playwright-app
        app.kubernetes.io/part-of: testkube-local-runner-e2e
    spec:
      containers:
        - name: app
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 1
          volumeMounts:
            - name: site
              mountPath: /www
              readOnly: true
      volumes:
        - name: site
          configMap:
            name: local-playwright-app
---
apiVersion: v1
kind: Service
metadata:
  name: local-playwright-app
  namespace: testkube-local
  labels:
    app.kubernetes.io/name: local-playwright-app
    app.kubernetes.io/part-of: testkube-local-runner-e2e
spec:
  selector:
    app.kubernetes.io/name: local-playwright-app
  ports:
    - name: http
      port: 8080
      targetPort: http
