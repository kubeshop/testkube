apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: jmeter-workflow-smoke
  labels:
    core-tests: workflows
    tool: jmeter
    category: performance-testing
    artifacts: "true"
    area: tools
  annotations:
    testkube.io/description: "Checks that Testkube runs a JMeter 5.6 plan in non-GUI mode and keeps the log, the JTL results and the HTML report."
    testkube.io/icon: jmeter
    testkube.io/areas: tools,artifacts
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/jmeter/jmeter-executor-smoke.jmx
  container:
    resources:
      requests:
        cpu: 512m
        memory: 512Mi
    workingDir: /data/repo/test/jmeter
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: Run tests
    run:
      image: alpine/jmeter:5.6
      shell: mkdir -p /data/artifacts && jmeter -n -t jmeter-executor-smoke.jmx -j /data/artifacts/jmeter.log -o /data/artifacts/report -l /data/artifacts/jtl-report.jtl -e
    steps:
    - name: Save artifacts
      workingDir: /data/artifacts
      artifacts:
        paths:
        - '**/*'
---
