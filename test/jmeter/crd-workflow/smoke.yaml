apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: distributed-jmeter-workflow-smoke
  labels:
    core-tests: workflows
    tool: jmeter
    artifacts: "true"
    category: performance-testing
    area: parallel
  annotations:
    testkube.io/description: "Checks that distributed JMeter works with the JMeter servers started as services and the controller sending the load through them."
    testkube.io/icon: jmeter
    testkube.io/areas: parallel,services,artifacts,tools
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/jmeter/jmeter-executor-smoke.jmx
  container:
    workingDir: /data/repo/test/jmeter
    resources:
        requests:
          cpu: 128m
          memory: 128Mi
  services:
    slave:
      use:
      - name: distribute/evenly
      count: 2
      timeout: 120s # initialization timeout
      logs: 'always'
      image: alpine/jmeter:5.6
      command:
      - jmeter-server
      - -Dserver.rmi.localport=60000
      - -Dserver_port=1099
      - -Jserver.rmi.ssl.disable=true
      resources:
        requests:
          cpu: 512m
          memory: 300Mi
      readinessProbe:
        tcpSocket:
          port: 1099
        periodSeconds: 1
  job:
    activeDeadlineSeconds: 600
  steps:
  - name: Run tests
    run:
      image: alpine/jmeter:5.6
      shell: mkdir -p /data/artifacts && jmeter -n -X -Jserver.rmi.ssl.disable=true -Jclient.rmi.localport=7000 -R {{services.slave.*.ip}} -t jmeter-executor-smoke.jmx -j /data/artifacts/jmeter.log -o /data/artifacts/report -l /data/artifacts/jtl-report.jtl -e
    steps:
    - name: Save artifacts
      workingDir: /data/artifacts
      artifacts:
        paths:
        - '**/*'
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: distributed-jmeter-workflow-smoke-shell
  labels:
    core-tests: workflows
    tool: jmeter
    artifacts: "true"
    category: performance-testing
    area: parallel
  annotations:
    testkube.io/description: "Checks that distributed JMeter works when the server services start from a shell command and the controller runs in non-GUI mode."
    testkube.io/icon: jmeter
    testkube.io/areas: parallel,services,artifacts,tools
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/jmeter/jmeter-executor-smoke.jmx
  container:
    workingDir: /data/repo/test/jmeter
    resources:
      requests:
        cpu: 512m
        memory: 300Mi
  services:
    slave:
      use:
      - name: distribute/evenly
      count: 2
      pod:
        tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: amd64
          effect: NoSchedule
      timeout: 120s # initialization timeout
      logs: 'always'
      image: alpine/jmeter:5.6
      shell: jmeter-server -Dserver.rmi.localport=60000 -Dserver_port=1099 -Jserver.rmi.ssl.disable=true
      resources:
        requests:
          cpu: 128m
          memory: 128Mi
      readinessProbe:
        tcpSocket:
          port: 1099
        periodSeconds: 1
  job:
    activeDeadlineSeconds: 600
  steps:
  - name: Run tests
    run:
      image: alpine/jmeter:5.6
      shell: mkdir -p /data/artifacts && jmeter -n -X -Jserver.rmi.ssl.disable=true -Jclient.rmi.localport=7000 -R {{services.slave.*.ip}} -t jmeter-executor-smoke.jmx -j /data/artifacts/jmeter.log -o /data/artifacts/report -l /data/artifacts/jtl-report.jtl -e
    steps:
    - name: Save artifacts
      workingDir: /data/artifacts
      artifacts:
        paths:
        - '**/*'
