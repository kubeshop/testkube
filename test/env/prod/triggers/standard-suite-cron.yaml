kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: tw-suite-standard-smoke-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
  annotations:
    testkube.io/description: "Production cron every 4 hours at minute 30: runs tw-suite-standard-smoke."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: tw-suite-standard-smoke
  events:
  - cronjob:
      cron: "30 */4 * * *" # every 4 hours
