kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: example-k6-prom
  labels:
    artifacts: "true"
    core-tests: wizard-examples
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: 6113bd607308028aa95f60418a904bc37765e81d
      paths:
      - test/k6/k6-smoke-test.js
  container:
    workingDir: /data/repo/test/k6
    image: grafana/k6:1.1.0
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: Run test
    steps:
    - shell: mkdir -p /data/artifacts
    - run:
        env:
        - name: K6_SYSTEM_ENV
          value: K6_SYSTEM_ENV_value
        - name: K6_WEB_DASHBOARD
          value: "true"
        - name: K6_WEB_DASHBOARD_EXPORT
          value: /data/artifacts/k6-test-report.html
        shell: k6 run k6-smoke-test.js -e K6_ENV_FROM_PARAM=K6_ENV_FROM_PARAM_value
          --duration 30s --summary-export /data/artifacts/summary.json
      steps:
      - name: Saving artifacts
        workingDir: /data/artifacts
        artifacts:
          paths:
          - '*'
