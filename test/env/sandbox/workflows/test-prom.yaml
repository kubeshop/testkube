kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: example-k6-prom
  labels:
    artifacts: "true"
    core-tests: wizard-examples
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: 6113bd607308028aa95f60418a904bc37765e81d
      paths:
      - test/k6/k6-smoke-test.js
  container:
    workingDir: /data/repo/test/k6
    image: grafana/k6:1.1.0
    resources:
      requests:
        cpu: 128m
        memory: 128Mi
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: Run test
    steps:
    - shell: mkdir -p /data/artifacts
    - run:
        env:
        - name: K6_SYSTEM_ENV
          value: K6_SYSTEM_ENV_value
        - name: K6_WEB_DASHBOARD
          value: "true"
        - name: K6_WEB_DASHBOARD_EXPORT
          value: /data/artifacts/k6-test-report.html
        shell: k6 run k6-smoke-test.js -e K6_ENV_FROM_PARAM=K6_ENV_FROM_PARAM_value
          --duration 30s --summary-export /data/artifacts/summary.json
      steps:
      - name: Saving artifacts
        workingDir: /data/artifacts
        artifacts:
          paths:
          - '*'
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: junit5-workflow-smoke-prom
  labels:
    artifacts: "true"
    category: unit-component-testing
    core-tests: workflows
    junit: "true"
    tool: junit
  annotations:
    argocd.argoproj.io/tracking-id: testkube-prom-metrics-agent:testworkflows.testkube.io/TestWorkflow:sandbox-prom-metrics/junit5-workflow-smoke
    testkube.io/icon: junit
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube
      revision: main
      paths:
      - test/junit/junit5-project
  container:
    workingDir: /data/repo/test/junit/junit5-project
    image: maven:3.9.9-eclipse-temurin-11-alpine
    resources:
      requests:
        cpu: 256m
        memory: 256Mi
  job:
    activeDeadlineSeconds: 300
  steps:
  - name: Run tests
    shell: mvn test -Dtest=TestSmoke1,TestSmoke2
    artifacts:
      paths:
      - target/surefire-reports/**/*
