kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: pytest-junit-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
    area: triggers
  annotations:
    testkube.io/description: "Starts the pytest mixed-failure and random-failure workflows every 2 hours, to keep fresh JUnit and flaky results in a sandbox environment."
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: pytest-workflow-smoke-junit-mixed-failures
      - name: pytest-workflow-smoke-junit-random-failures
  events:
  - cronjob:
      cron: "15 */2 * * *" # every 2 hours
