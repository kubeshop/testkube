kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: junit5-workflow-smoke-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
    area: triggers
  annotations:
    testkube.io/description: "Starts junit5-workflow-smoke every 2 hours, to keep fresh JUnit results in a sandbox environment."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: junit5-workflow-smoke
  events:
  - cronjob:
      cron: "15 */2 * * *" # every 2 hours
