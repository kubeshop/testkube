kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: junit5-workflow-smoke-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: workflow-trigger
  annotations:
    testkube.io/description: "dev-e2e environment cron at minute 50 of each hour: runs junit5-workflow-smoke."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: junit5-workflow-smoke
  events:
  - cronjob:
      cron: "50 * * * *" # every 1 hour
