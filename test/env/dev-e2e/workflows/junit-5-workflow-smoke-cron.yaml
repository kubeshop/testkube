kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: junit5-workflow-smoke-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: workflow-trigger
  annotations:
    testkube.io/description: "Starts junit5-workflow-smoke each hour at minute 50, to keep fresh JUnit results on the dev-e2e environment."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: junit5-workflow-smoke
  events:
  - cronjob:
      cron: "50 * * * *" # every 1 hour
