# Make sure to update workflows for both dev (postgres) and dev-mongo environment
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-ui-e2e
  labels:
    core-tests: cloud-ui-e2e-mongo
    artifacts: "true"
    dev-quality-gate: "true"
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{ config.GIT_REVISION }}'
      paths:
      - js
      usernameFrom:
        secretKeyRef:
          name: 'testkube-agent-mongo-secrets'
          key: 'CLOUD_UI_E2E_GITHUB_USERNAME'
      tokenFrom:
        secretKeyRef:
          name: 'testkube-agent-mongo-secrets'
          key: 'CLOUD_UI_E2E_GITHUB_TOKEN'
  job:
    activeDeadlineSeconds: 1200
  config:
    CLOUD_BASE_URL: {type: string, default: 'https://app-mongo.testkube.dev'}
    GIT_REVISION: {type: string, default: 'main'}
  container:
    resources:
      requests:
        cpu: 2
        memory: 2Gi
    workingDir: /data/repo/js/packages/e2e-tests
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
    - name: npm_config_cache
      value: /root/.npm
    - name: CLOUD_BASE_URL
      value: '{{ config.CLOUD_BASE_URL }}'
    - name: CLOUD_API_URL
      value: 'https://api-mongo.testkube.dev'
    - name: TEST_ORG_ID
      value: 'tkcorg_9deb42dda2197657'
    - name: TEST_ORG_SLUG
      value: 'testkube'
    - name: TEST_ENV_ID # Env with connected agent (Testkube-cloud-test-dev-E2E) - used for running some of the tests
      value: 'tkcenv_f2eedeef4063f90f'
    - name: TEST_ENV_SLUG
      value: 'testkube-cloud-test-dev-e2e'
    - name: TEST_FIXTURE_USER # Test user having access to connected environment
      value: 'test-user-10'
    - name: TESTKUBE_NAMESPACE # namespace where agent is installed
      value: 'testkube-agent-mongo-e2e'
  steps:
  - name: Install dependencies
    shell: npm ci --prefer-offline
    cache:
      key: cloud-ui-e2e-v1-npm-{{hash_files("/data/repo/js/package-lock.json")}}
      restoreKeys:
      - cloud-ui-e2e-v1-npm-
      paths:
      - /root/.npm/_cacache
  - name: Run tests
    timeout: 15m
    shell: npx playwright test --retries=1
    artifacts:
      paths:
      - playwright-report/**
      - test-results/**
  - name: E2E Test Coverage report
    optional: true
    shell: npm run scenario-coverage
  - name: Cleanup test resources
    timeout: 2m
    condition: always
    optional: true
    shell: npm run resources:cleanup
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-ui-e2e-distributed
  labels:
    core-tests: cloud-ui-e2e-mongo
    artifacts: "true"
    distributed: "true"
    junit: "true"
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{ config.GIT_REVISION }}'
      paths:
      - js
      usernameFrom:
        secretKeyRef:
          name: 'testkube-agent-mongo-secrets'
          key: 'CLOUD_UI_E2E_GITHUB_USERNAME'
      tokenFrom:
        secretKeyRef:
          name: 'testkube-agent-mongo-secrets'
          key: 'CLOUD_UI_E2E_GITHUB_TOKEN'
  job:
    activeDeadlineSeconds: 1200
  config:
    CLOUD_BASE_URL: {type: string, default: 'https://app-mongo.testkube.dev'}
    GIT_REVISION: {type: string, default: 'main'}
    SHARDS: {type: integer, default: 10}
  container:
    workingDir: /data/repo/js/packages/e2e-tests
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    resources:
      requests:
        cpu: 256m
        memory: 256Mi
    env:
    - name: npm_config_cache
      value: /root/.npm
    - name: CLOUD_BASE_URL
      value: '{{ config.CLOUD_BASE_URL }}'
    - name: CLOUD_API_URL
      value: 'https://api-mongo.testkube.dev'
    - name: TEST_ORG_ID
      value: 'tkcorg_9deb42dda2197657'
    - name: TEST_ORG_SLUG
      value: 'testkube'
    - name: TEST_ENV_ID # Env with connected agent (Testkube-cloud-test-dev-E2E) - used for running some of the tests
      value: 'tkcenv_f2eedeef4063f90f'
    - name: TEST_ENV_SLUG
      value: 'testkube-cloud-test-dev-e2e'
    - name: TEST_FIXTURE_USER # Test user having access to connected environment
      value: 'test-user-10'
    - name: TESTKUBE_NAMESPACE # namespace where agent is installed
      value: 'testkube-agent-mongo-e2e'
  steps:
  - name: Install dependencies
    shell: npm ci --prefer-offline
    cache:
      key: cloud-ui-e2e-distributed-v1-npm-{{hash_files("/data/repo/js/package-lock.json")}}
      restoreKeys:
      - cloud-ui-e2e-distributed-v1-npm-
      paths:
      - /root/.npm/_cacache
  - name: Run tests
    parallel:
      description: "Shard: {{ index + 1 }}/{{ count }}"
      count: 'config.SHARDS'
      parallelism: 2
      transfer:
      - from: /data/repo
      container:
        resources:
          requests:
            cpu: 1500m
            memory: 1500Mi
      run:
        shell: 'mkdir /data/artifacts && npx playwright test --reporter=list,junit --shard={{ index + 1 }}/{{ count }}'
        env:
        - name: PLAYWRIGHT_JUNIT_OUTPUT_NAME
          value: "/data/artifacts/junit-report-{{ index + 1 }}.xml"
      artifacts:
        workingDir: /data/artifacts/
        paths:
        - '**/*'
  - name: E2E Test Coverage report
    optional: true
    shell: npm run scenario-coverage
