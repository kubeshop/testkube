kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: edge-cases-expected-failure-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
    area: triggers
  annotations:
    testkube.io/description: "Starts the expected-failure suite at 10:55 each day, to check that the dev Mongo environment still reports failures correctly."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: edge-cases-expected-failure-suite
  events:
  - cronjob:
      cron: "55 10 * * *" # once a day
