kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: tw-suite-full-smoke-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
  annotations:
    testkube.io/description: "Starts tw-suite-full-smoke at 02:45 and 14:45, to catch tool integration regressions on the dev Mongo environment."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: tw-suite-full-smoke
  events:
  - cronjob:
      cron: "45 02,14 * * *" # twice a day at 02:45 and 14:45