kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: edge-cases-special-cases-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
  annotations:
    testkube.io/description: "Starts the special-cases suite at 10:45 each day, to catch engine regressions on the dev Mongo environment."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: edge-cases-special-cases-suite
  events:
  - cronjob:
      cron: "45 10 * * *" # once a day
