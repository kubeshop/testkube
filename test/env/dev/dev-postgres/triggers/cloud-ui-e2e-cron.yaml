kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-ui-e2e-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: workflow-trigger
  annotations:
    testkube.io/description: "dev cron every 4 hours at minute 20: runs the cloud-ui-e2e dashboard tests."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: cloud-ui-e2e
  events:
  - cronjob:
      cron: "20 0/4 * * *"
