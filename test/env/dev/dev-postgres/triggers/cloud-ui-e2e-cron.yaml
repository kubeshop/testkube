kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-ui-e2e-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: workflow-trigger
    area: triggers
  annotations:
    testkube.io/description: "Starts the cloud-ui-e2e dashboard tests every 4 hours, to catch dashboard regressions on .dev."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: cloud-ui-e2e
  events:
  - cronjob:
      cron: "20 0/4 * * *"
