kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: tw-suite-full-smoke-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
    area: triggers
  annotations:
    testkube.io/description: "Starts tw-suite-full-smoke at 01:45 and 13:45, to catch tool integration regressions on .dev."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: tw-suite-full-smoke
  events:
  - cronjob:
      cron: "45 01,13 * * *" # twice a day at 01:45 and 13:45