apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: quality-loop-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: quality-loop-suite
  events:
  - cronjob:
      cron: "58 6,18 * * *" # twice a day at 06:58 and 18:58
