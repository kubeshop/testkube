kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: testkube-installation-tests-workflow-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
  annotations:
    testkube.io/description: "Starts the installation tests suite every 4 hours, to check that Testkube still installs."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: testkube-installation-tests-workflow-suite
  events:
  - cronjob:
      cron: "55 */4 * * *" # every 4 hours
