kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: prod-healthchecks-workflow-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
    tool: healthcheck
    area: triggers
  annotations:
    testkube.io/description: "Starts the production health checks suite every 15 minutes, to detect a production outage fast."
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: prod-healthchecks-workflow-suite
  events:
  - cronjob:
      cron: "*/15 * * * *" # every 15 minutes
