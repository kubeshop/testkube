kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: testkube-multiagent-targets-workflow-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
    area: triggers
  annotations:
    testkube.io/description: "Starts the runner targeting suite every 4 hours, to check runner targeting on .dev."
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: testkube-multiagent-targets-workflow-suite
  events:
  - cronjob:
      cron: "40 */4 * * *" # every 4 hours
