apiVersion: tests.testkube.io/v1
kind: TestTrigger
metadata:
  name: git-trigger-push-main-branch
spec:
  resource: content
  event: git-push
  contentSelector:
    git:
      uri: https://github.com/kubeshop/testkube
      authType: github
      branches:
        - main
  action: run
  execution: testworkflow
  testSelector:
    name: git-triggered-workflow-push-main-branch
    namespace: testkube-agent
---
apiVersion: tests.testkube.io/v1
kind: TestTrigger
metadata:
  name: git-trigger-pr-content-trigger
spec:
  resource: content
  event: git-pull-request
  contentSelector:
    git:
      uri: https://github.com/kubeshop/testkube
      authType: github
      paths:
        - "src/**"
      pullRequest:
        types: ["opened", "synchronize", "reopened"]
        branches: ["main"]
        branchesIgnore: ["release/*"]
  action: run
  execution: testworkflow
  testSelector:
    name: git-triggered-workflow-pr-content-trigger
    namespace: testkube-agent
---
# GitLab merge requests use the same spec as GitHub pull requests. The provider is
# detected from the uri, and the pullRequest.types vocabulary is unchanged: a merged
# or closed merge request reports "closed", new commits report "synchronize".
#
# GitLab has no equivalent of the GitHub App integration, so authType: github does
# not apply; supply a personal, project or group access token with the read_api
# scope through token or tokenFrom instead.
apiVersion: tests.testkube.io/v1
kind: TestTrigger
metadata:
  name: git-trigger-gitlab-mr-content-trigger
spec:
  resource: content
  event: git-pull-request
  contentSelector:
    git:
      uri: https://gitlab.com/kubeshop-examples/testkube-examples
      tokenFrom:
        secretKeyRef:
          name: gitlab-credentials
          key: token
      paths:
        - "src/**"
      pullRequest:
        types: ["opened", "synchronize", "reopened"]
        branches: ["main"]
        branchesIgnore: ["release/*"]
  action: run
  execution: testworkflow
  testSelector:
    name: git-triggered-workflow-pr-content-trigger
    namespace: testkube-agent