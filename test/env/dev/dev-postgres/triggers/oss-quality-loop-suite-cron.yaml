apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: oss-quality-loop-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
  annotations:
    testkube.io/description: "dev cron at 07:30 each day: runs oss-quality-loop-suite."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: oss-quality-loop-suite
  events:
  - cronjob:
      cron: "30 7 * * *" # once a day at 07:30 in the scheduler timezone
