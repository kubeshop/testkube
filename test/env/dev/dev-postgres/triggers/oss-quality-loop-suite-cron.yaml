apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: oss-quality-loop-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
    area: triggers
  annotations:
    testkube.io/description: "Starts oss-quality-loop-suite at 07:30 each day, to run the testkube and testkube-docs quality-loop checks each day."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: oss-quality-loop-suite
  events:
  - cronjob:
      cron: "30 7 * * *" # once a day at 07:30 in the scheduler timezone
