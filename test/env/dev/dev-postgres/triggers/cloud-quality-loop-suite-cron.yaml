apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: cloud-quality-loop-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
    area: triggers
  annotations:
    testkube.io/description: "Starts cloud-quality-loop-suite at 06:58 and 18:58, to run the cloud API quality-loop checks twice a day."
    testkube.io/cost: heavy
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: cloud-quality-loop-suite
  events:
  - cronjob:
      cron: "58 6,18 * * *" # twice a day at 06:58 and 18:58
