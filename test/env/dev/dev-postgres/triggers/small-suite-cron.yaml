kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: tw-suite-small-smoke-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
  annotations:
    testkube.io/description: "dev cron every 2 hours at minute 5: runs tw-suite-small-smoke."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: tw-suite-small-smoke
  events:
  - cronjob:
      cron: "5 */2 * * *" # every 2 hours (+ triggered on every .dev deployment)
