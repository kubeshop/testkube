kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: edge-cases-special-cases-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
  annotations:
    testkube.io/description: "Starts the special-cases suite every 4 hours, to catch engine regressions on .dev."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: edge-cases-special-cases-suite
  events:
  - cronjob:
      cron: "05 */4 * * *" # every 4 hours
