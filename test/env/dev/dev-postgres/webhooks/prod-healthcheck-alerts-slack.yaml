apiVersion: executor.testkube.io/v1
kind: Webhook
metadata:
  name: prod-healthcheck-alerts
spec:
  events:
  - end-testworkflow-failed
  - end-testworkflow-aborted
  uri: '{{credential("webhook-slack-prod-healthcheck-alerts-url")}}'
  selector: environment=prod
  payloadTemplate: |-
    {
      "text": ":alert: *Prod healthcheck {{ .TestWorkflowExecution.Workflow.Name }} failed*\n*Execution*: {{.TestWorkflowExecution.Name}}\n*Status*: {{ .Type_ }}\n*Possible Severity*: Critical\n*Possible Impact*: Production connectivity issue, production agent/control plane issue, or an execution issue in a `.dev` environment.\n*Logs*: {{ .ExecutionURL }}"
    }

---
apiVersion: executor.testkube.io/v1
kind: Webhook
metadata:
  name: prod-healthcheck-back-to-normal
spec:
  events:
  - become-testworkflow-up
  uri: '{{credential("webhook-slack-prod-healthcheck-alerts-url")}}'
  selector: environment=prod
  payloadTemplate: |-
    {
      "text": ":large_green_circle: *Prod healthcheck {{ .TestWorkflowExecution.Workflow.Name }} recovered*\n*Logs*: {{ .ExecutionURL }}"
    }
