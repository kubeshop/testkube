apiVersion: executor.testkube.io/v1
kind: Webhook
metadata:
  name: slack-cloud-ui-e2e-alerts
spec:
  events:
  - end-testworkflow-failed
  - end-testworkflow-aborted
  uri: '{{credential("webhook-slack-cloud-ui-e2e-alerts-url")}}'
  selector: core-tests=cloud-ui-e2e
  payloadTemplate: |-
    {
      "text": ":alert: *Cloud UI E2E {{ .TestWorkflowExecution.Workflow.Name }} failed*\n*Environment*: dev-postgres\n*Execution*: {{.TestWorkflowExecution.Name}}\n*Status*: {{ .Type_ }}\n*Possible Severity*: Medium\n*Possible Impact*: Regression in the `main` branch affecting the `.dev` environment or blocking a release.\n*Logs*: {{ .ExecutionURL }}"
    }

---
apiVersion: executor.testkube.io/v1
kind: Webhook
metadata:
  name: slack-cloud-ui-e2e-back-to-normal
spec:
  events:
  - become-testworkflow-up
  uri: '{{credential("webhook-slack-cloud-ui-e2e-alerts-url")}}'
  selector: core-tests=cloud-ui-e2e
  payloadTemplate: |-
    {
      "text": ":large_green_circle: *Cloud UI E2E {{ .TestWorkflowExecution.Workflow.Name }} recovered*\n*Logs*: {{ .ExecutionURL }}"
    }
