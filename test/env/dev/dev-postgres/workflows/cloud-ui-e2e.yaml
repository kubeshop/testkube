kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-ui-e2e
  labels:
    core-tests: cloud-ui-e2e
    tool: playwright
    artifacts: "true"
    junit: "true"
    playwright-traces: "on"
    category: e2e-ui-testing
    dev-quality-gate: "true"
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{ config.revision }}'
      authType: github
      paths:
      - js
  job:
    activeDeadlineSeconds: 1200
  container:
    workingDir: /data/repo/js/packages/e2e-tests
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    resources:
      requests:
        cpu: 2
        memory: 2Gi
  services:
    ui:
      count: 'config.revision == "main" ? 0 : 1'
      image: node:24-bookworm
      transfer:
      - from: /data/repo
      workingDir: /data/repo/js
      shell: |
        npm ci
        npm run build --workspace=@testkube/web
        (cd packages/web && npm run env:vercel)
        (cd packages/web && npx vite preview --host 0.0.0.0 --port 5173)
      resources:
        requests:
          cpu: 2
          memory: 2Gi
      timeout: 10m
      readinessProbe:
        httpGet:
          path: /
          port: 5173
        periodSeconds: 2
  steps:
  - name: Install dependencies
    shell: npm install
  - name: Run tests
    timeout: 15m
    run:
      env:
      - name: CLOUD_BASE_URL
        value: '{{ config.revision == "main" ? "https://app.testkube.dev" : "http://" + services.ui.0.ip + ":5173" }}'
      - name: CLOUD_API_URL
        value: https://api.testkube.dev
      - name: TEST_ORG_ID
        value: tkcorg_9deb42dda2197657
      - name: TEST_ORG_SLUG
        value: testkube
      - name: TEST_ENV_ID
        value: tkcenv_f2eedeef4063f90f
      - name: TEST_ENV_SLUG
        value: testkube-cloud-test-dev-e2e
      - name: TEST_FIXTURE_USER
        value: test-user-10
      - name: TESTKUBE_NAMESPACE
        value: testkube-agent-e2e
      shell: npx playwright test --retries=1
    artifacts:
      paths:
      - playwright-report/**
      - test-results/**
  - name: E2E Test Coverage report
    optional: true
    shell: npm run scenario-coverage
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-ui-e2e-distributed
  labels:
    core-tests: cloud-ui-e2e
    tool: playwright
    artifacts: "true"
    junit: "true"
    playwright-traces: "on"
    category: e2e-ui-testing
    distributed: "true"
spec:
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{ config.revision }}'
      paths:
      - js/packages/e2e-tests
      usernameFrom:
        secretKeyRef:
          name: 'testkube-agent-secrets'
          key: 'CLOUD_UI_E2E_GITHUB_USERNAME'
      tokenFrom:
        secretKeyRef:
          name: 'testkube-agent-secrets'
          key: 'CLOUD_UI_E2E_GITHUB_TOKEN'
  job:
    activeDeadlineSeconds: 1200
  config:
    CLOUD_BASE_URL: {type: string, default: 'https://app.testkube.dev'}
    revision: {type: string, default: 'main'}
    SHARDS: {type: integer, default: 10}
  container:
    workingDir: /data/repo/js/packages/e2e-tests
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    resources:
      requests:
        cpu: 256m
        memory: 256Mi
    env:
    - name: CLOUD_BASE_URL
      value: '{{ config.CLOUD_BASE_URL }}'
    - name: CLOUD_API_URL
      value: 'https://api.testkube.dev'
    - name: TEST_ORG_ID
      value: 'tkcorg_9deb42dda2197657'
    - name: TEST_ORG_SLUG
      value: 'testkube'
    - name: TEST_ENV_ID # Env with connected agent (Testkube-cloud-test-dev-E2E) - used for running some of the tests
      value: 'tkcenv_f2eedeef4063f90f'
    - name: TEST_ENV_SLUG
      value: 'testkube-cloud-test-dev-e2e'
    - name: TEST_FIXTURE_USER # Test user having access to connected environment
      value: 'test-user-10'
    - name: TESTKUBE_NAMESPACE # namespace where agent is installed
      value: 'testkube-agent-e2e'
  steps:
  - name: Install dependencies
    shell: npm install
  - name: Run tests
    parallel:
      description: "Shard: {{ index + 1 }}/{{ count }}"
      count: 'config.SHARDS'
      parallelism: 2
      transfer:
      - from: /data/repo
      container:
        resources:
          requests:
            cpu: 1500m
            memory: 1500Mi
      run:
        shell: 'mkdir /data/artifacts && npx playwright test --reporter=list,junit --shard={{ index + 1 }}/{{ count }}'
        env:
        - name: PLAYWRIGHT_JUNIT_OUTPUT_NAME
          value: "/data/artifacts/junit-report-{{ index + 1 }}.xml"
      artifacts:
        workingDir: /data/artifacts/
        paths:
        - '**/*'
  - name: E2E Test Coverage report
    optional: true
    shell: npm run scenario-coverage
