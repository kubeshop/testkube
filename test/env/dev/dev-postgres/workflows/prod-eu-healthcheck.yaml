kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: prod-eu-healthcheck
  labels:
    core-tests: healthcheck
    environment: prod # triggers prod-specific webhooks
spec:
  pod:
    # Healthchecks drive prod alerts; keep them off spot nodes so a preemption does not page as an outage.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: NotIn
                  values: ["true"]
  system:
    pureByDefault: true
  job:
    activeDeadlineSeconds: 420
  container:
    image: kubeshop/testkube-cli:latest
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
    env:
      - name: apiToken
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: TESTKUBE-CLOUD-EU-TESTKUBE-RUN-TOKEN-FOR-DEV
      - name: organizationId
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: TESTKUBE-CLOUD-EU-TESTKUBE-ORG-ID
      - name: environmentId
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: TESTKUBE-CLOUD-EU-TESTKUBE-ENV-ID
  # A transient container I/O error ("/.tktw/bin/sh: testkube: I/O error") or a dropped log
  # stream fails a step here without prod being involved, and the alert reads as a prod
  # outage. One retry per step keeps that noise out of the channel; a real outage fails
  # both attempts. The job deadline leaves room for the second attempt.
  steps:
  - name: Disable telemetry (optional)
    optional: true
    shell: testkube disable telemetry
  - name: Set context
    retry:
      count: 1
    timeout: 1m
    shell: |
      testkube set context \
        --api-key {{ shellquote(env.apiToken) }} \
        --org-id {{ shellquote(env.organizationId) }} \
        --env-id {{ shellquote(env.environmentId) }} \
        --root-domain eu.testkube.io
  - name: Run remote workflow
    retry:
      count: 1
    timeout: 2m
    shell: testkube run tw postman-workflow-smoke -f
