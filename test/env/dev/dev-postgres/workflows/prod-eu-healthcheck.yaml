kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: prod-eu-healthcheck
  labels:
    core-tests: healthcheck
    environment: prod # triggers prod-specific webhooks
spec:
  pod:
    # Healthchecks drive prod alerts; keep them off spot nodes so a preemption does not page as an outage.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: NotIn
                  values: ["true"]
  system:
    pureByDefault: true
  job:
    activeDeadlineSeconds: 600
  container:
    image: kubeshop/testkube-cli:latest
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
    env:
      - name: apiToken
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: TESTKUBE-CLOUD-EU-TESTKUBE-RUN-TOKEN-FOR-DEV
      - name: organizationId
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: TESTKUBE-CLOUD-EU-TESTKUBE-ORG-ID
      - name: environmentId
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: TESTKUBE-CLOUD-EU-TESTKUBE-ENV-ID
  # A transient container I/O error in the runner pod ("/.tktw/bin/sh: testkube: I/O error",
  # 2026-11-16) fails a step without prod being involved, and this alert reads as a prod
  # outage. One retry per step keeps that out of the channel; a real outage still fails both
  # attempts. Every step carries its own timeout: the runtime only retries a timed-out step
  # when the timeout is the step's own, and an unbounded step would otherwise run until the
  # job deadline. activeDeadlineSeconds covers both attempts plus scheduling and image pull.
  steps:
  - name: Disable telemetry (optional)
    optional: true
    timeout: 30s
    shell: testkube disable telemetry
  - name: Set context
    retry:
      count: 1
    timeout: 1m
    shell: |
      testkube set context \
        --api-key {{ shellquote(env.apiToken) }} \
        --org-id {{ shellquote(env.organizationId) }} \
        --env-id {{ shellquote(env.environmentId) }} \
        --root-domain eu.testkube.io
  - name: Run remote workflow
    retry:
      count: 1
    timeout: 3m
    shell: testkube run tw postman-workflow-smoke -f
