kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-api-e2e
  labels:
    core-tests: cloud-api-e2e
    tool: playwright
    artifacts: "true"
    junit: "true"
    playwright-traces: "on"
    category: e2e-api-testing
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{ config.revision }}'
      authType: github
      paths:
      - js
  container:
    workingDir: /data/repo/js/packages/e2e-tests
    image: node:24-bookworm
    env:
    - name: npm_config_cache
      value: /root/.npm
    - name: CI
      value: "true"
    - name: CLOUD_API_URL
      value: https://api.testkube.dev
    resources:
      requests:
        cpu: 1
        memory: 1Gi
  steps:
  - name: Install dependencies
    workingDir: /data/repo/js
    shell: npm ci --prefer-offline
    cache:
      key: cloud-api-e2e-v1-npm-{{hash_files("/data/repo/js/package-lock.json")}}
      restoreKeys:
      - cloud-api-e2e-v1-npm-
      paths:
      - /root/.npm/_cacache
  - name: Run API tests
    timeout: 18m
    shell: npx playwright test --project=api --retries=1 --workers=2
    artifacts:
      paths:
      - playwright-report/**
      - test-results/**
  - name: API Test Coverage report
    optional: true
    shell: npm run scenario-coverage -- --project=api
