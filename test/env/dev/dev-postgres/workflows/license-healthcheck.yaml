kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: license-healthcheck
  labels:
    core-tests: healthcheck
    environment: prod
spec:
  pod:
    # Healthchecks drive prod alerts; keep them off spot nodes so a preemption does not page as an outage.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: NotIn
                  values: ["true"]
  system:
    pureByDefault: true
  timeouts:
    # Bound the gap between job start and the first step container, so a scheduling or
    # image-pull problem aborts with the cause Kubernetes reported instead of being
    # swallowed by activeDeadlineSeconds, which budgets 120s for it.
    initialization: 120s
  job:
    # 2x2m installing dependencies plus 2x1m on the check is 6m, 120s for initialization,
    # and a minute of slack for teardown.
    activeDeadlineSeconds: 540
  container:
    image: alpine:3.22.2
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  # A transient container I/O error in the runner pod fails a step without the license
  # endpoint being involved. One retry per step keeps that out of the alarms channel; a real
  # outage still fails both attempts. Every step carries its own timeout: the runtime only
  # retries a timed-out step when the timeout is the step's own, and an unbounded step would
  # otherwise run until the job deadline.
  steps:
  - name: Install dependencies
    retry:
      count: 1
    timeout: 2m
    shell: |
      apk add --no-cache curl jq
  - name: License endpoint healthcheck
    retry:
      count: 1
    timeout: 1m
    run:
      env:
      - name: LICENSE_KEY
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: ENTERPRISE_INSTALLATION_TEST_LICENSE_KEY
      shell: |
        RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" \
        -d "{\"license\":\"$LICENSE_KEY\"}" \
        https://license.testkube.io/validate)

        echo "$RESPONSE" | jq

        [ "$(echo "$RESPONSE" | jq -r '.code')" = "VALID" ] || exit 1
        [ "$(echo "$RESPONSE" | jq -r '.valid')" = "true" ] || exit 1

        echo "License healthcheck OK"
