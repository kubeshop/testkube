kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: license-healthcheck
  labels:
    core-tests: healthcheck
    environment: prod
spec:
  pod:
    # Healthchecks drive prod alerts; keep them off spot nodes so a preemption does not page as an outage.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: NotIn
                  values: ["true"]
  system:
    pureByDefault: true
  job:
    activeDeadlineSeconds: 420
  container:
    image: alpine:3.22.2
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  # A transient container I/O error ("/.tktw/bin/sh: testkube: I/O error") or a dropped log
  # stream fails a step here without prod being involved, and the alert reads as a prod
  # outage. One retry per step keeps that noise out of the channel; a real outage fails
  # both attempts. The job deadline leaves room for the second attempt.
  steps:
  - name: Install dependencies
    retry:
      count: 1
    timeout: 1m
    shell: |
      apk add --no-cache curl jq
  - name: License endpoint healthcheck
    retry:
      count: 1
    timeout: 1m
    run:
      env:
      - name: LICENSE_KEY
        valueFrom:
          secretKeyRef:
            name: testkube-agent-secrets
            key: ENTERPRISE_INSTALLATION_TEST_LICENSE_KEY
      shell: |
        RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" \
        -d "{\"license\":\"$LICENSE_KEY\"}" \
        https://license.testkube.io/validate)

        echo "$RESPONSE" | jq

        [ "$(echo "$RESPONSE" | jq -r '.code')" = "VALID" ] || exit 1
        [ "$(echo "$RESPONSE" | jq -r '.valid')" = "true" ] || exit 1

        echo "License healthcheck OK"
