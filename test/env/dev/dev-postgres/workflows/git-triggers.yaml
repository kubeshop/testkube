apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
description: "Git triggered workflow - on push to main branch"
metadata:
  name: git-triggered-workflow-push-main-branch
  labels:
    core-tests: git-triggers
    area: triggers
  annotations:
    testkube.io/description: "Passes in one step; a Git trigger runs it on a push to the main branch, to check that push triggers fire."
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  job:
    activeDeadlineSeconds: 60
  steps:
    - name: Step
      shell: echo "step"
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
description: "Git triggered workflow - on pr being created/updated/reopened"
metadata:
  name: git-triggered-workflow-pr-content-trigger
  labels:
    core-tests: git-triggers
    area: triggers
  annotations:
    testkube.io/description: "Passes in one step; a Git trigger runs it when a pull request is opened, updated or reopened, to check that pull request triggers fire."
    testkube.io/cost: light
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  job:
    activeDeadlineSeconds: 60
  steps:
    - name: Step
      shell: echo "step"