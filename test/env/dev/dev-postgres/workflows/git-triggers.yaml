apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
description: "Git triggered workflow - on push to main branch"
metadata:
  name: git-triggered-workflow-push-main-branch
  labels:
    core-tests: git-triggers
spec:
  container:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  job:
    activeDeadlineSeconds: 60
  steps:
    - name: Step
      shell: echo "step"
