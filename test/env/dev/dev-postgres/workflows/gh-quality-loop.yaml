      set -euo pipefail
      apk add --no-cache git make bash
      make helm-vendor-check
      make helm-lint
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-gomod-codegen
  labels:
    category: build-integration
    quality-loop: "true"
    core-tests: cloud-api
    team-backend: "true"
    tool: go
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{config.revision}}'
      authType: github
  container:
    workingDir: /data/repo
    image: golang:1.26.6-bookworm
    env:
    - name: GOMODCACHE
      value: /root/go/pkg/mod
    - name: GOPROXY
      value: https://proxy.golang.org,direct
    - name: GOCACHE
      value: /root/.cache/go-build
    resources:
      limits:
        cpu: 4
        memory: 8Gi
      requests:
        cpu: 2
        memory: 4Gi
  job:
    activeDeadlineSeconds: 600
  steps:
  - name: Check go.mod, go.sum, and OpenAPI
    cache:
      # The build cache too: the OpenAPI generation builds cmd/openapi-merge and runs
      # ogen through `go tool`, each from source unless the build cache already holds
      # it. Keyed on the modules, which declare ogen, and the image's Go, whose outputs
      # only it can reuse.
      key: cloud-gomod-codegen-v2-golang-1.26.6-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum")}}
      restoreKeys:
      - cloud-gomod-codegen-v2-golang-1.26.6-
      paths:
      - /root/go/pkg/mod/cache/download
      - /root/.cache/go-build
    shell: |-
      set -euo pipefail
      # git and make come with the golang image.
      git config --global --add safe.directory /data/repo

      go mod tidy
      if [ -n "$(git status -s -uno)" ]; then
        echo "Go modules are not synchronized. Run 'go mod tidy' and commit."
        git status -s -uno
        git --no-pager diff
        exit 1
      fi

      make generate-openapi-spec
      changed=$(git status -s -uno pkg/ internal/ ':(exclude)internal/server/apidocs/testkube-cloud-docs.json' | wc -l)
      if [ "$changed" -gt 0 ]; then
        echo "Generated OpenAPI models are not synchronized. Run 'make generate-openapi-spec' and commit."
        git status -s -uno pkg/ internal/ ':(exclude)internal/server/apidocs/testkube-cloud-docs.json'
        git --no-pager diff pkg/ internal/ ':(exclude)internal/server/apidocs/testkube-cloud-docs.json'
        exit 1
      fi
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-test-app
  labels:
    category: api-testing
    quality-loop: "true"
    coverage: "true"
    core-tests: cloud-api
    artifacts: "true"
    junit: "true"
    team-backend: "true"
    tool: go
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{config.revision}}'
      authType: github
  container:
    workingDir: /data/repo
    image: golang:1.26.6-bookworm
    env:
    - name: GOMODCACHE
      value: /root/go/pkg/mod
    - name: E2E
      value: "y"
    - name: INTEGRATION
      value: "y"
    - name: GOPROXY
      value: https://proxy.golang.org,direct
    - name: VAULT_ADDR
      value: http://127.0.0.1:8200
    - name: VAULT_TOKEN
      value: root
    - name: API_POSTGRES_URL
      value: postgres://postgres:postgres@127.0.0.1:5432/testkube_users_test?sslmode=disable
    - name: OAUTH_ISSUER_URL
      value: https://api.testkube.dev/idp
    - name: API_ADDRESS
      value: https://api.testkube.dev/idp
    - name: DASHBOARD_ADDRESS
      value: https://app.testkube.dev
    - name: STORAGE_EMULATOR_HOST
      value: http://127.0.0.1:4443
    - name: GOOGLE_CLOUD_PROJECT
      value: test
    resources:
      limits:
        cpu: 8
        memory: 16Gi
      requests:
        cpu: 4
        memory: 8Gi
  job:
    activeDeadlineSeconds: 1800
  services:
    gcs:
      logs: always
      timeout: 180s
      image: fsouza/fake-gcs-server:1.52.2
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
      args:
      - -scheme
      - http
      - -port
      - "4443"
      - -public-host
      - 127.0.0.1:4443
      - -backend
      - memory
      readinessProbe:
        tcpSocket:
          port: 4443
        periodSeconds: 1
    minio:
      logs: always
      timeout: 180s
      image: bitnamilegacy/minio:2025.5.24@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
      env:
      - name: MINIO_ROOT_USER
        value: minio99
      - name: MINIO_ROOT_PASSWORD
        value: minio123
      - name: MINIO_DEFAULT_BUCKETS
        value: test-bucket
      - name: MINIO_SKIP_CLIENT
        value: "yes"
      readinessProbe:
        httpGet:
          path: /minio/health/ready
          port: 9000
        periodSeconds: 2
    mongo:
      logs: always
      timeout: 180s
      image: mongo:6.0.27
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 2Gi
      readinessProbe:
        tcpSocket:
          port: 27017
        periodSeconds: 1
    nats:
      logs: always
      timeout: 180s
      image: nats:2.9.11
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      readinessProbe:
        tcpSocket:
          port: 4222
        periodSeconds: 1
    postgres:
      logs: always
      timeout: 180s
      image: postgres:18.4
      args:
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      resources:
        requests:
          cpu: 1
          memory: 512Mi
        limits:
          cpu: 4
          memory: 2Gi
      env:
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        value: postgres
      - name: POSTGRES_DB
        value: testkube_users_test
      readinessProbe:
        tcpSocket:
          port: 5432
        periodSeconds: 1
    smtp:
      logs: always
      timeout: 180s
      image: rnwood/smtp4dev:v3
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      readinessProbe:
        tcpSocket:
          port: 25
        periodSeconds: 1
    vault:
      logs: always
      timeout: 180s
      image: hashicorp/vault:2.0.1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
      - name: VAULT_DEV_ROOT_TOKEN_ID
        value: root
      - name: VAULT_DEV_LISTEN_ADDRESS
        value: 0.0.0.0:8200
      securityContext:
        capabilities:
          add:
          - IPC_LOCK
      readinessProbe:
        tcpSocket:
          port: 8200
        periodSeconds: 1
  steps:
  - name: Run tests
    cache:
      key: cloud-test-app-v1-gomod-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum")}}
      restoreKeys:
      - cloud-test-app-v1-gomod-
      paths:
      - /root/go/pkg/mod/cache/download
    steps:
    - name: Run test suite
      cache:
        # Keyed on the modules only: the build cache addresses its own contents, so it
        # stays correct across commits, where a key per commit would grow storage
        # without bound. go.mod carries the toolchain directive, and the image tag covers
        # an image newer than it: build outputs only serve the toolchain that made them.
        key: cloud-test-app-v1-golang-1.26.6-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum")}}
        restoreKeys:
        - cloud-test-app-v1-golang-1.26.6-
        paths:
        - /root/.cache/go-build
        scope: workflow
      run:
        env:
        - name: GOCACHE
          value: /root/.cache/go-build
        # GOCACHE also holds test results, which do not track the services these
        # tests talk to; always run the tests.
        - name: GOFLAGS
          value: -count=1
        shell: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq socat curl
          git config --global --add safe.directory /data/repo
          mkdir -p /data/artifacts

          forward() {{"{"}}
            local port="$1" dest="$2"
            socat TCP-LISTEN:${{"{"}}port},bind=127.0.0.1,fork,reuseaddr TCP:${{"{"}}dest} &
          }
          forward 27017 "{{services.mongo.0.ip}}:27017"
          forward 4222 "{{services.nats.0.ip}}:4222"
          forward 9000 "{{services.minio.0.ip}}:9000"
          forward 5432 "{{services.postgres.0.ip}}:5432"
          forward 8200 "{{services.vault.0.ip}}:8200"
          forward 2525 "{{services.smtp.0.ip}}:25"
          forward 4443 "{{services.gcs.0.ip}}:4443"
          sleep 1

          curl -sS -X POST "http://127.0.0.1:4443/storage/v1/b?project=test" \
            -H "Content-Type: application/json" \
            -d '{{"{"}}"name":"testkube_integration_tests"}' \
            || true

          set +e
          go tool gotestsum --format pkgname --hide-summary skipped \
            --junitfile /data/artifacts/junit.xml \
            -- -coverprofile=/data/artifacts/coverage.out -covermode=atomic ./...
          code=$?
          echo "gotestsum_exit=${{"{"}}code}"
          kill $(jobs -p) 2>/dev/null
          wait
          exit "${{"{"}}code}"
      artifacts:
        paths:
        - /data/artifacts/**
