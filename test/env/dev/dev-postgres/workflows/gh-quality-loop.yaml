kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-web-unit
  labels:
    category: unit-component-testing
    quality-loop: "true"
    core-tests: cloud-ui
    artifacts: "true"
    junit: "true"
    team-frontend: "true"
    package: web
    tool: vitest
spec:
  system:
    pureByDefault: true
  config:
    revision:
      description: Git ref to clone (branch, tag, or SHA). Quality Loop injects the
        PR head.
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{config.revision}}'
      authType: github
      cone: true
      paths:
      - js
  container:
    workingDir: /data/repo/js
    image: node:24-bookworm
    env:
    - name: npm_config_cache
      value: /root/.npm
    resources:
      limits:
        cpu: 4
        memory: 6Gi
      requests:
        cpu: 2
        memory: 4Gi
  job:
    activeDeadlineSeconds: 1200
  steps:
  - name: Install
    shell: corepack enable npm && npm ci --prefer-offline
    cache:
      key: cloud-web-unit-v1-npm-{{hash_files("/data/repo/js/package-lock.json")}}
      restoreKeys:
      - cloud-web-unit-v1-npm-
      paths:
      - /root/.npm/_cacache
  - name: Test
    shell: |
      mkdir -p /data/artifacts
      npm test -w @testkube/web -- \
        --reporter=default \
        --reporter=junit \
        --outputFile.junit=/data/artifacts/junit.xml
    artifacts:
      workingDir: /data/artifacts
      paths:
      - '**/*'
---
