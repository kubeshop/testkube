kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-lint-go
  labels:
    category: static-analysis
    quality-loop: "true"
    core-tests: cloud-api
    team-backend: "true"
    tool: golangci-lint
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{config.revision}}'
      authType: github
  container:
    workingDir: /data/repo
    env:
    - name: GOMODCACHE
      value: /root/go/pkg/mod
    resources:
      limits:
        cpu: 8
        memory: 8Gi
      requests:
        cpu: 2
        memory: 4Gi
  job:
    activeDeadlineSeconds: 1500
  steps:
  - name: Lint OpenAPI
    run:
      image: stoplight/spectral:6.14.2
      shell: spectral lint api/v1/base.yaml
  - name: Lint Golang
    cache:
      key: cloud-lint-go-v1-gomod-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum")}}
      restoreKeys:
      - cloud-lint-go-v1-gomod-
      paths:
      - /root/go/pkg/mod/cache/download
    steps:
    - name: Analyze Go packages
      cache:
        # Keyed on the modules and lint config, never the sources: both caches address
        # their own contents, so one entry serves every commit until dependencies change.
        key: cloud-lint-go-v2-golangci-2.12.2-{{hash_files("/data/repo/go.mod", "/data/repo/go.sum", "/data/repo/.golangci.yml")}}
        restoreKeys:
        - cloud-lint-go-v2-golangci-2.12.2-
        paths:
        - /root/.cache/go-build
        - /root/.cache/golangci-lint
        scope: workflow
      run:
        image: golangci/golangci-lint:v2.12.2
        env:
        - name: GOPROXY
          value: https://proxy.golang.org,direct
        - name: GOCACHE
          value: /root/.cache/go-build
        - name: GOLANGCI_LINT_CACHE
          value: /root/.cache/golangci-lint
        shell: |-
          golangci-lint run -c ./.golangci.yml \
            --verbose \
            --timeout=20m \
            --issues-exit-code=1 \
            --max-issues-per-linter=0 \
            ./...
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-lint-js
  labels:
    category: static-analysis
    quality-loop: "true"
    core-tests: cloud-ui
    team-frontend: "true"
    team-backend: "true"
    tool: turbo
spec:
  system:
    pureByDefault: true
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{config.revision}}'
      authType: github
      cone: true
      paths:
      - js
  container:
    workingDir: /data/repo/js
    image: node:24-bookworm
    env:
    - name: npm_config_cache
      value: /root/.npm
    - name: NODE_OPTIONS
      value: --max_old_space_size=4096
    resources:
      limits:
        cpu: 4
        memory: 8Gi
      requests:
        cpu: 2
        memory: 4Gi
  job:
    activeDeadlineSeconds: 1200
  steps:
  - name: Validate lockfile platform entries
    shell: |
      node -e "
      const lock = require('./package-lock.json');
      const pkgs = lock.packages || {};
      const required = ['@rollup/rollup-linux-x64-gnu', '@esbuild/linux-x64'];
      const bad = [];
      for (const [name, entry] of Object.entries(pkgs)) {
        if (required.some(r => name.includes(r)) && (!entry.version || !entry.resolved)) {
          bad.push(name + ' is incomplete (missing version/resolved)');
        }
      }
      if (bad.length) { console.error(bad.join('\\n')); process.exit(1); }
      console.log('Lockfile platform entries: OK');
      "
  - name: Install
    shell: corepack enable npm && npm ci --prefer-offline
    cache:
      key: cloud-lint-js-v1-npm-{{hash_files("/data/repo/js/package-lock.json")}}
      restoreKeys:
      - cloud-lint-js-v1-npm-
      paths:
      - /root/.npm/_cacache
  - name: Checks
    cache:
      # Turbo's task cache, kept between runs: a package whose inputs are unchanged
      # skips its type check, format check and lint. Each run saves a new entry and
      # restores the newest, so the cache follows main rather than staying at the first
      # run's sources; entries hold only task logs, so one per run stays small.
      key: cloud-lint-js-v1-turbo-{{execution.id}}
      restoreKeys:
      - cloud-lint-js-v1-turbo-
      paths:
      - /data/repo/js/.turbo
    steps:
    - name: Check TypeScript types
      shell: npx turbo run ts-check --cache-dir=.turbo
    - name: Check formatting
      shell: npx turbo run format:check --cache-dir=.turbo
    - name: Check linters
      shell: npx turbo run lint --cache-dir=.turbo
---
kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: cloud-lint-helm
  labels:
    category: static-analysis
    quality-loop: "true"
    core-tests: cloud-api
    team-backend: "true"
    team-frontend: "true"
    tool: helm
spec:
  config:
    revision:
      type: string
      default: main
  content:
    git:
      uri: https://github.com/kubeshop/testkube-cloud-api.git
      revision: '{{config.revision}}'
      authType: github
      cone: true
      paths:
      - helm
      - Makefile
  container:
    workingDir: /data/repo
    image: alpine/helm:3.16.4
    resources:
      limits:
        cpu: 2
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
