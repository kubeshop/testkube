apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: testkube-oss-workflow-suite
  labels:
    core-tests: workflows-suite
    type: suite
    tool: testkube-oss
    dev-quality-gate: "true"
    area: install
  annotations:
    testkube.io/description: "Groups the Testkube OSS tests, to check the OSS installations with MongoDB and with PostgreSQL."
    testkube.io/cost: heavy
    testkube.io/sandbox: needs-cluster
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: oss-tests-mongo
      - name: oss-tests-postgres

