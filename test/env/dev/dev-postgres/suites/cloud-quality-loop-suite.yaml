apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: cloud-quality-loop-suite
  labels:
    dev-quality-gate: "true"
    core-tests: workflows-suite
    type: suite
  annotations:
    testkube.io/description: "Suite that runs every testkube-cloud-api quality-loop check: the web, backoffice and runspace-controller unit tests, Go, JS and Helm lint, skills drift, go.mod and codegen, and the Go app tests."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      parallelism: 2
      workflows:
      - name: cloud-web-unit
      - name: cloud-backoffice-unit
      - name: cloud-runspace-controller-unit
      - name: cloud-lint-go
      - name: cloud-lint-js
      - name: cloud-lint-helm
      - name: cloud-skills-drift
      - name: cloud-gomod-codegen
      - name: cloud-test-app
