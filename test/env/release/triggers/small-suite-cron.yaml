kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: tw-suite-small-smoke-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
  annotations:
    testkube.io/description: "Starts tw-suite-small-smoke every 2 hours, as a fast regression check of the release environment."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: tw-suite-small-smoke
  events:
  - cronjob:
      cron: "15 */2 * * *" # every 2 hours
