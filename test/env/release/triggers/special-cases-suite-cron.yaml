kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: edge-cases-special-cases-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
    area: triggers
  annotations:
    testkube.io/description: "Starts the special-cases suite at 10:35 each day, to catch engine regressions in the release environment."
    testkube.io/cost: medium
    testkube.io/sandbox: ok
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: edge-cases-special-cases-suite
  events:
  - cronjob:
      cron: "35 10 * * *" # once a day
