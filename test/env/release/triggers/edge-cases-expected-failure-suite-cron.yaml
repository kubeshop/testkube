kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: edge-cases-expected-failure-suite-cron-trigger
  labels:
    core-tests: workflows-suite-trigger
    type: suite-trigger
  annotations:
    testkube.io/description: "Release environment cron at 10:50 each day: runs the expected-failure suite."
spec:
  container:
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  steps:
  - execute:
      workflows:
      - name: edge-cases-expected-failure-suite
  events:
  - cronjob:
      cron: "50 10 * * *" # once a day
