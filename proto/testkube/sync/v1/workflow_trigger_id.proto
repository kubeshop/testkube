edition = "2023";

package testkube.sync.v1;

// WorkflowTriggerId is the information required to
// uniquely identify a WorkflowTrigger object.
message WorkflowTriggerId {
  // Id is the unique ID string for a WorkflowTrigger.
  string id = 1;
  // namespace is the Kubernetes namespace the object was deleted from.
  // Optional: when empty the Control Plane uses the agent's default namespace,
  // as before this field existed.
  string namespace = 2;
}
