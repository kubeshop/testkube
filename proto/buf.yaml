# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
    - COMMENTS
  ignore:
    - logs.proto
    - service.proto
  # Bidirectional stream envelopes; ConnectRequest/ConnectResponse would be misleading.
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - testkube/runspace/v1/runspace_service.proto
    RPC_RESPONSE_STANDARD_NAME:
      - testkube/runspace/v1/runspace_service.proto
breaking:
  use:
    - FILE
  ignore:
    - logs.proto
    - service.proto
